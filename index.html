<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f6f2">
<title>Jack Sales Tracker — V1</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--text:#20211f;--muted:#777871;--line:#e6e4dd;--accent:#20211f;--green:#4f765c;--red:#a35b52;--yellow:#9a7b38}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC",sans-serif}
.app{max-width:1100px;margin:auto;padding-bottom:90px}.top{padding:24px 20px 12px;display:flex;justify-content:space-between;align-items:end}.brand{font-size:24px;font-weight:700}.sub{font-size:12px;color:var(--muted);margin-top:4px}
nav{position:sticky;top:0;z-index:5;background:rgba(246,245,241,.94);backdrop-filter:blur(14px);display:flex;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line);overflow:auto}
nav button{border:0;background:transparent;padding:10px 13px;border-radius:12px;white-space:nowrap;color:var(--muted);font-weight:600}nav button.active{background:#20211f;color:white}
main{padding:16px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}.metric{font-size:25px;font-weight:750;margin-top:6px}.label{font-size:12px;color:var(--muted)}.section{margin:22px 0 10px;font-size:15px;font-weight:750}.progress{height:8px;background:#eceae3;border-radius:8px;overflow:hidden;margin:10px 0}.bar{height:100%;background:#20211f;border-radius:8px}
.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.stack{display:flex;flex-direction:column;gap:10px}.pill{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:700;background:#eeece6}.pill.green{background:#e6efe8;color:#42644d}.pill.red{background:#f4e5e2;color:#914d45}.pill.yellow{background:#f3ecd8;color:#82692c}
button.primary{background:#20211f;color:#fff;border:0;border-radius:12px;padding:11px 15px;font-weight:700}button.secondary{background:white;border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-weight:650}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid #dcdad2;border-radius:11px;background:white;font:inherit}textarea{min-height:80px}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}.full{grid-column:1/-1}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.list{display:flex;flex-direction:column;gap:9px}.item{background:white;border:1px solid var(--line);border-radius:15px;padding:14px}.item h3{font-size:15px;margin:0 0 5px}.small{font-size:12px;color:var(--muted)}.right{text-align:right}.hide{display:none}.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed #d8d6ce;border-radius:16px}
@media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}.formgrid{grid-template-columns:1fr}.top{padding:20px 16px 10px}main{padding:12px}.metric{font-size:21px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div><div class="brand">Jack Sales Tracker</div><div class="sub">Insurance CRM · V1 Prototype</div></div><button class="primary" onclick="openCase()">＋ New Case</button></header>
<nav id="nav">
<button class="active" onclick="show('home',this)">Home</button><button onclick="show('pipeline',this)">Pipeline</button><button onclick="show('clients',this)">Clients</button><button onclick="show('contest',this)">Contest</button><button onclick="show('income',this)">Income</button>
</nav>
<main>
<section id="home"></section><section id="pipeline" class="hide"></section><section id="clients" class="hide"></section><section id="contest" class="hide"></section><section id="income" class="hide"></section>
</main>
</div>

<script>
const KEY='jackSalesV1';
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{
cases:[], contests:[],
settings:{rates:[.25,.25,.135,.185,.15,.15]}
};
function save(){localStorage.setItem(KEY,JSON.stringify(db));render()}
function money(n){return 'RM '+Number(n||0).toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2})}
function dateStr(d){return d?new Date(d+'T00:00:00').toLocaleDateString('en-MY',{day:'2-digit',month:'short',year:'numeric'}):'-'}
function monthsBetween(a,b){return Math.max(0,(new Date(b)-new Date(a))/(30.4375*864e5))}
function annual(c){return c.payMode==='monthly'?c.premium*12:c.payMode==='quarterly'?c.premium*4:c.payMode==='halfyearly'?c.premium*2:c.premium}
function tpc(c){return c.tpc||annual(c)}
function factor(c){return c.term==='10'?0.5:c.term==='5'?0.25:1}
function duration(c){return c.term==='5'?5:6}
function eligible(c, onDate=new Date()){return c.status==='Inforce'}
function commissionForYear(c,y){if(y<1||y>duration(c)||!eligible(c))return 0;return tpc(c)*db.settings.rates[y-1]*factor(c)}
function monthlyComm(c, date){
  if(!eligible(c)) return 0;
  const start=new Date(c.inforce+'T00:00:00'), d=new Date(date+'T00:00:00');
  let m=Math.floor((d.getFullYear()-start.getFullYear())*12+d.getMonth()-start.getMonth())+1;
  if(m<1||m>duration(c)*12)return 0;
  const y=Math.ceil(m/12), yearly=commissionForYear(c,y);
  return c.payMode==='monthly'?yearly/12:c.payMode==='quarterly'?(m%3===1?yearly/4:0):c.payMode==='halfyearly'?(m%6===1?yearly/2:0):(m===((y-1)*12+1)?yearly:0);
}
function thisMonth(){let d=new Date();return d.toISOString().slice(0,7)}
function production(month){
 return db.cases.filter(c=>c.type!=='Reduce'&&c.inforce.startsWith(month)&&c.status==='Inforce')
}
function show(id,btn){document.querySelectorAll('main section').forEach(x=>x.classList.add('hide'));document.getElementById(id).classList.remove('hide');document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));btn.classList.add('active');render()}
function render(){home();pipeline();clients();contest();income()}
function home(){
 let m=thisMonth(), cs=production(m), t=cs.reduce((s,c)=>s+tpc(c),0), prem=cs.reduce((s,c)=>s+annual(c),0);
 let all=db.cases, pipe=['To Approach','To Meet Up','To Follow Up','To Submit','To Approve'];
 document.getElementById('home').innerHTML=`
 <div class="section">September 2026 · Production Overview</div>
 <div class="grid">
  <div class="card"><div class="label">TPC this month</div><div class="metric">${money(t)}</div></div>
  <div class="card"><div class="label">Cases</div><div class="metric">${cs.length}</div></div>
  <div class="card"><div class="label">Annual Premium</div><div class="metric">${money(prem)}</div></div>
  <div class="card"><div class="label">Active Clients</div><div class="metric">${new Set(all.filter(c=>c.status==='Inforce').map(c=>c.ic)).size}</div></div>
 </div>
 <div class="section">Pipeline</div><div class="grid">${pipe.map(s=>`<div class="card"><div class="label">${s}</div><div class="metric">${all.filter(c=>c.status===s).length}</div></div>`).join('')}</div>
 <div class="section">Recent Cases</div><div class="list">${all.filter(c=>c.status==='Inforce').slice(-5).reverse().map(card).join('')||'<div class="empty">No cases yet. Tap “＋ New Case”.</div>'}</div>`;
}
function card(c){return `<div class="item"><div class="row"><div><h3>${c.client}</h3><div class="small">${c.type} · ${c.benefit||'—'}</div></div><div class="right"><b>${money(tpc(c))}</b><br><span class="pill ${c.status==='Inforce'?'green':c.status==='Lapse'?'red':''}">${c.status}</span></div></div><div class="small" style="margin-top:8px">${dateStr(c.inforce)} · ${c.payMode} · ${c.kind||'New Business'}</div></div>`}
function pipeline(){
 let statuses=['To Approach','To Meet Up','To Follow Up','To Submit','To Approve','Inforce'];
 document.getElementById('pipeline').innerHTML=`<div class="section">Sales Pipeline</div><div class="list">${statuses.map(s=>{let x=db.cases.filter(c=>c.status===s);return `<div class="card"><div class="row"><b>${s}</b><span class="pill">${x.length}</span></div><div class="list" style="margin-top:10px">${x.map(c=>`<div class="item"><div class="row"><div><b>${c.client}</b><div class="small">${c.type} · ${money(tpc(c))}</div></div><button class="secondary" onclick="editCase('${c.id}')">${s==='To Approve'?'Approve / Edit':'Open'}</button></div></div>`).join('')||'<div class="small">No records</div>'}</div></div>`}).join('')}</div>`;
}
function clients(){
 let map={};db.cases.forEach(c=>{if(!map[c.ic])map[c.ic]={client:c.client,ic:c.ic,cases:[]};map[c.ic].cases.push(c)});
 document.getElementById('clients').innerHTML=`<div class="row"><div class="section">Client Portfolio</div><button class="secondary" onclick="exportCSV()">Export CSV</button></div><div class="list">${Object.values(map).map(x=>`<div class="item"><div class="row"><div><h3>${x.client}</h3><div class="small">${x.ic} · ${x.cases.length} record(s)</div></div><b>${money(x.cases.filter(c=>c.status==='Inforce').reduce((s,c)=>s+tpc(c),0))} TPC</b></div><div style="margin-top:10px">${x.cases.filter(c=>c.status==='Inforce').map(c=>`<div class="small">• ${c.type} — ${money(annual(c))}/yr · ${c.kind||'New Business'} · Inforce ${dateStr(c.inforce)}</div>`).join('')}</div></div>`).join('')||'<div class="empty">No clients yet.</div>'}</div>`;
}
function contest(){
 document.getElementById('contest').innerHTML=`<div class="row"><div class="section">Contest Tracker</div><button class="primary" onclick="newContest()">＋ Create Contest</button></div><div class="list">${db.contests.map((x,i)=>{let eligibleCases=db.cases.filter(c=>c.status==='Inforce'&&c.inforce>=x.start&&c.inforce<=x.end&&(x.type==='Any'||c.type===x.type));let val=x.metric==='TPC'?eligibleCases.reduce((s,c)=>s+tpc(c),0):eligibleCases.length;let pct=x.target?Math.min(100,val/x.target*100):0;return `<div class="card"><div class="row"><div><h3>${x.name}</h3><div class="small">${x.start} → ${x.end} · ${x.type==='Any'?'All Types':x.type}</div></div><button class="secondary" onclick="deleteContest(${i})">Delete</button></div><div class="metric">${x.metric==='TPC'?money(val):val+' cases'}</div><div class="progress"><div class="bar" style="width:${pct}%"></div></div><div class="small">${pct.toFixed(1)}% of target ${x.metric==='TPC'?money(x.target):x.target+' cases'}</div></div>`}).join('')||'<div class="empty">Create your first flexible contest. Each contest can have its own period, insurance type and target.</div>'}</div>`;
}
function income(){
 let now=new Date(), month=now.toISOString().slice(0,7), total=db.cases.reduce((s,c)=>s+monthlyComm(c,month+'-01'),0);
 let active=db.cases.filter(c=>c.status==='Inforce'), future=active.reduce((s,c)=>{let sum=0;for(let y=1;y<=duration(c);y++)sum+=commissionForYear(c,y);return s+sum},0);
 document.getElementById('income').innerHTML=`<div class="section">Estimated Income</div><div class="grid"><div class="card"><div class="label">This Month</div><div class="metric">${money(total)}</div></div><div class="card"><div class="label">Active Policies</div><div class="metric">${active.length}</div></div><div class="card"><div class="label">Future Commission*</div><div class="metric">${money(future)}</div></div><div class="card"><div class="label">Commission Model</div><div class="metric">6 yrs</div></div></div><div class="section">Commission Rates</div><div class="card"><div class="small">Year 1–6: 25% · 25% · 13.5% · 18.5% · 15% · 15%</div><div class="small" style="margin-top:8px">10-year term ÷2 · 5-year term ÷4. 5-year term stops after Year 5.</div></div><div class="section">Active Policy Income</div><div class="list">${active.map(c=>`<div class="item"><div class="row"><div><b>${c.client}</b><div class="small">${c.type} · ${c.payMode} · ${c.term==='20'?'Full Pay':c.term+' Year'}</div></div><b>${money(monthlyComm(c,month+'-01'))}/this period</b></div></div>`).join('')||'<div class="empty">No active policies.</div>'}</div><div class="small" style="margin-top:12px">*Future Commission is a rough projection based on current active status and stored rules.</div>`;
}
function openCase(c={}){let el=document.createElement('div');el.innerHTML=`<div style="position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:20;padding:12px;overflow:auto"><div class="card" style="max-width:720px;margin:30px auto"><div class="row"><h2>${c.id?'Edit Case':'New Case'}</h2><button class="secondary" onclick="this.closest('[style*=fixed]').remove()">Close</button></div><form onsubmit="saveCase(event,'${c.id||''}')"><div class="formgrid">
<div class="field"><label>Client Name</label><input name="client" required value="${c.client||''}"></div>
<div class="field"><label>Client IC</label><input name="ic" required value="${c.ic||''}"></div>
<div class="field"><label>Type of Insurance</label><input name="type" required placeholder="Investment Link / Medical / Life..." value="${c.type||''}"></div>
<div class="field"><label>Case Type</label><select name="kind"><option ${c.kind==='New Business'?'selected':''}>New Business</option><option ${c.kind==='Top Up'?'selected':''}>Top Up</option><option ${c.kind==='Reduce'?'selected':''}>Reduce</option></select></div>
<div class="field full"><label>Benefit</label><textarea name="benefit">${c.benefit||''}</textarea></div>
<div class="field"><label>Inforce / Effective Date</label><input type="date" name="inforce" value="${c.inforce||new Date().toISOString().slice(0,10)}"></div>
<div class="field"><label>Status</label><select name="status">${['To Approach','To Meet Up','To Follow Up','To Submit','To Approve','Inforce','Surrender','Lapse','Ceased'].map(s=>`<option ${c.status===s?'selected':''}>${s}</option>`).join('')}</select></div>
<div class="field"><label>Premium (per payment)</label><input type="number" step=".01" name="premium" required value="${c.premium||''}"></div>
<div class="field"><label>Payment Mode</label><select name="payMode">${[['monthly','Monthly'],['quarterly','Quarterly'],['halfyearly','Half-Yearly'],['yearly','Yearly']].map(a=>`<option value="${a[0]}" ${c.payMode===a[0]?'selected':''}>${a[1]}</option>`).join('')}</select></div>
<div class="field"><label>Payment Term</label><select name="term"><option value="20" ${(!c.term||c.term==='20')?'selected':''}>20 Year / Full Pay</option><option value="10" ${c.term==='10'?'selected':''}>10 Year</option><option value="5" ${c.term==='5'?'selected':''}>5 Year</option></select></div>
<div class="field"><label>TPC / First Year Annual Premium</label><input type="number" step=".01" name="tpc" value="${c.tpc||''}" placeholder="Auto from premium if blank"></div>
</div><div class="actions"><button type="button" class="secondary" onclick="this.closest('[style*=fixed]').remove()">Cancel</button><button class="primary">Save Case</button></div></form></div></div>`;document.body.appendChild(el)}
function saveCase(e,id){e.preventDefault();let f=new FormData(e.target), o=Object.fromEntries(f.entries());o.id=id||Date.now().toString();o.premium=+o.premium;o.tpc=o.tpc?+o.tpc:annual(o);if(id){let i=db.cases.findIndex(x=>x.id===id);db.cases[i]={...db.cases[i],...o}}else db.cases.push(o);e.target.closest('[style*=fixed]').remove();save()}
function editCase(id){openCase(db.cases.find(c=>c.id===id))}
function newContest(){let name=prompt('Contest name');if(!name)return;let start=prompt('Start date (YYYY-MM-DD)',thisMonth()+'-01');let end=prompt('End date (YYYY-MM-DD)',new Date().toISOString().slice(0,10));let metric=prompt('Metric: TPC or Cases','TPC');let type=prompt('Insurance type, or Any','Any');let target=+prompt('Target',metric==='TPC'?'100000':'20');db.contests.push({name,start,end,metric:metric==='Cases'?'Cases':'TPC',type:type||'Any',target});save()}
function deleteContest(i){if(confirm('Delete this contest?')){db.contests.splice(i,1);save()}}
function exportCSV(){let rows=[['Client','IC','Insurance Type','Benefit','Case Type','Inforce','Status','Premium','Payment Mode','Term','TPC']].concat(db.cases.map(c=>[c.client,c.ic,c.type,(c.benefit||'').replaceAll('\n',' '),c.kind||'New Business',c.inforce,c.status,c.premium,c.payMode,c.term,c.tpc]));let csv=rows.map(r=>r.map(v=>`"${String(v??'').replaceAll('"','""')}"`).join(',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='jack-sales-tracker.csv';a.click()}
render();
</script>

<style>
.brand{font-size:24px}
.stage-closed{display:none}
.expandStage{cursor:pointer}
</style>
<script>
/* V1.1 functional patch — keeps V1 layout, changes workflow/data behavior */
document.title="Sales Tracker";
const OLD=window.db;
if(OLD){
  OLD.settings=Object.assign({products:["PRU With You Plus","PRU Wealth Enrich 2.0","PRU Lady / Man"],groups:["A","B","C","D"],benefits:["Death / TPD","TMCC","43 CI","Acci Death / TPD","Acci Medical Reimbursement (per case)","Medical Card","Payor"],password:"1234"},OLD.settings||{});
  OLD.rates=[.25,.25,.135,.185,.15,.15];
  localStorage.setItem("salesTrackerV12",JSON.stringify(OLD));
}
function passwordGate(){
 if(sessionStorage.getItem("salesTrackerUnlocked")==="1") return;
 document.body.innerHTML=`<div id="lockScreen" style="min-height:100vh;background:#f6f5f1;display:flex;align-items:center;justify-content:center;padding:24px;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','PingFang SC',sans-serif"><div style="width:100%;max-width:360px;text-align:center"><div style="font-size:28px;font-weight:700;margin-bottom:8px">Sales Tracker</div><div style="color:#777871;font-size:14px;margin-bottom:24px">Enter password to continue</div><input id="lockPassword" type="password" inputmode="numeric" autocomplete="current-password" placeholder="Password" style="width:100%;padding:14px;border:1px solid #dcdad2;border-radius:12px;background:white;font-size:17px;text-align:center;box-sizing:border-box"><button id="unlockBtn" style="width:100%;margin-top:10px;padding:14px;border:0;border-radius:12px;background:#20211f;color:white;font-weight:700;font-size:16px">Unlock</button><div id="lockError" style="color:#a35b52;font-size:13px;margin-top:10px;min-height:18px"></div></div></div>`;
 const input=document.getElementById('lockPassword'),btn=document.getElementById('unlockBtn'),err=document.getElementById('lockError');
 function unlock(){if(input.value===db.settings.password){sessionStorage.setItem('salesTrackerUnlocked','1');location.reload()}else{err.textContent='Wrong password';input.value='';input.focus()}}
 btn.onclick=unlock;input.addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});input.focus();
}



function startCase(){
 openModal(`<h2>New Case</h2><div class="menuGrid">
 <button class="menuBtn" onclick="chooseNB()">New Business<span>New policy / new sale</span></button>
 <button class="menuBtn" onclick="chooseTU()">Top Up<span>Existing policy upgrade</span></button>
 </div>`);
}
function chooseNB(){openModal(`<h2>New Business</h2><div class="menuGrid">
 <button class="menuBtn" onclick="caseFormV11('new')">New Client<span>Key in client details</span></button>
 <button class="menuBtn" onclick="existingClientPicker()">Existing Client<span>Select an existing client</span></button>
 </div>`)}
function existingClientPicker(){
 openModal(`<h2>New Business · Existing Client</h2><div class="field"><label>Client Name</label><input id="ecq" oninput="clientSuggest('ecq','ecs')" placeholder="Type existing client name"><div id="ecs" class="list" style="margin-top:8px"></div></div>`)
}
function clientSuggest(inp,out){
 let q=document.getElementById(inp).value.toLowerCase();
 let m=new Map(db.cases.filter(c=>c.client.toLowerCase().includes(q)).map(c=>[c.ic,c]));
 document.getElementById(out).innerHTML=[...m.values()].map(c=>`<button class="secondary" onclick="caseFormV11('existing','${c.ic}')">${c.client} · ${c.ic}</button>`).join("");
}
function chooseTU(){
 openModal(`<h2>Top Up</h2><div class="field"><label>Existing Client</label><input id="tuq" oninput="clientSuggest('tuq','tus')" placeholder="Type existing client name"><div id="tus" class="list" style="margin-top:8px"></div></div>`)
}
function caseFormV11(mode,ic="",topProduct=""){
 let c=ic?db.cases.find(x=>x.ic===ic):{};
 let products=db.settings.products,groups=db.settings.groups;
 let productOptions=products.map(p=>`<option>${p}</option>`).join("");
 let groupOptions=groups.map(g=>`<option ${c.group===g?"selected":""}>${g}</option>`).join("");
 let existingProducts=ic?[...new Set(db.cases.filter(x=>x.ic===ic).map(x=>x.product))]:[];
 let topHtml=mode==="topup"?`<div class="field full"><label>Existing Product to Top Up</label><select name="topProduct">${existingProducts.map(p=>`<option>${p}</option>`).join("")}</select></div>`:"";
 let clientHtml=mode==="new"?`<div class="field"><label>Client Name</label><input name="client" required></div><div class="field"><label>IC</label><input name="ic" required></div><div class="field"><label>Client Group</label><select name="group">${groupOptions}</select></div>`:`<div class="field full"><label>Client</label><input value="${c.client||""}" disabled><input type="hidden" name="client" value="${c.client||""}><input type="hidden" name="ic" value="${c.ic||""}><input type="hidden" name="group" value="${c.group||""}></div>`;
 let benefits=db.settings.benefits.map(b=>{
   if(b==="Medical Card") return `<div class="benefitRow"><b>Medical Card</b><div class="coverageGrid"><input name="med_plan" placeholder="Medical Plan Name"><input name="med_limit" type="number" placeholder="Annual Limit"><input name="med_whole" type="number" placeholder="Whole Life Limit"><input name="med_room" type="number" placeholder="Room & Board"><input name="med_deduct" type="number" placeholder="Deductible / Med Saver"></div></div>`;
   if(b==="Payor") return `<div class="benefitRow"><label><input style="width:auto" type="checkbox" name="payor"> Payor</label></div>`;
   return `<div class="benefitRow"><b>${b}</b><input name="b_${b.replace(/[^a-zA-Z]/g,"_")}" type="number" step=".01" placeholder="Coverage Amount"></div>`;
 }).join("");
 openModal(`<h2>${mode==="topup"?"Top Up":mode==="existing"?"New Business · Existing Client":"New Business · New Client"}</h2>
 <form onsubmit="saveCaseV11(event)">
 <div class="formgrid">${clientHtml}${topHtml}
 <div class="field"><label>Product</label><select name="product">${productOptions}</select></div>
 <div class="field full"><label>Benefit</label>${benefits}</div>
 <div class="field"><label>Inforce Date</label><input type="date" name="inforce" required value="${new Date().toISOString().slice(0,10)}"></div>
 <div class="field"><label>Status</label><select name="status"><option>Inforce</option><option>To Approve</option><option>To Submit</option><option>To Follow Up</option></select></div>
 <div class="field"><label>Payment Mode</label><select name="payMode"><option value="monthly">Monthly</option><option value="quarterly">Quarterly</option><option value="halfyearly">Half-Yearly</option><option value="yearly">Yearly</option></select></div>
 <div class="field"><label>Premium (per month)</label><input type="number" step=".01" name="premium" required></div>
 <div class="field"><label>Payment Term</label><select name="term"><option value="20">20 Year / Full Pay</option><option value="10">10 Year</option><option value="5">5 Year</option></select></div>
 <div class="field"><label>TPC</label><input name="tpc" readonly placeholder="Auto count"></div></div>
 <div class="actions"><button type="button" class="secondary" onclick="closeModal()">Cancel</button><button class="primary">Save Case</button></div></form>`);
 let f=document.querySelector("#modalRoot form"),p=f.querySelector("[name=premium]"),modeEl=f.querySelector("[name=payMode]"),t=f.querySelector("[name=tpc]");
 function calc(){let x=+p.value||0,m=modeEl.value;t.value=(m==="monthly"?x*12:m==="quarterly"?x*4:m==="halfyearly"?x*2:x).toFixed(2)}
 p.oninput=calc;modeEl.onchange=calc;
 window.currentCaseMode=mode; calc();
}
function saveCaseV11(e){
 e.preventDefault();let f=new FormData(e.target),o=Object.fromEntries(f.entries());
 o.id=Date.now().toString();o.premium=+o.premium;
 o.tpc=o.payMode==="monthly"?o.premium*12:o.payMode==="quarterly"?o.premium*4:o.payMode==="halfyearly"?o.premium*2:o.premium;
 o.kind=window.currentCaseMode==="topup"?"Top Up":"New Business";
 o.benefit=JSON.stringify(Object.fromEntries([...f.entries()].filter(([k])=>k.startsWith("b_")||["med_plan","med_limit","med_whole","med_room","med_deduct","payor"].includes(k))));
 db.cases.push(o);closeModal();save();
}
function render(){
 home();pipeline();clients();contest();income();
}
function home(){
 let cs=productionList?productionList('month'):db.cases.filter(c=>c.status==="Inforce"&&c.inforce.startsWith(new Date().toISOString().slice(0,7)));
 let t=cs.reduce((s,c)=>s+(+c.tpc||0),0),cc=cs.reduce((s,c)=>s+Math.floor((+c.tpc||0)/1800),0);
 document.getElementById("home").innerHTML=`<div class="section">${new Date().toLocaleString("en-MY",{month:"long",year:"numeric"})} · Production Overview</div>
 <div class="grid"><div class="card" onclick="breakdownV11('TPC',cs)"><div class="label">TPC</div><div class="metric">${money(t)}</div><div class="small">Tap for breakdown</div></div>
 <div class="card" onclick="breakdownV11('Cases',cs)"><div class="label">Cases</div><div class="metric">${cc}</div><div class="small">RM1,800 TPC = 1 case</div></div></div>
 <div class="section">Ongoing Contests</div><div class="list">${(db.contests||[]).filter(x=>new Date(x.end)>=new Date()).map(x=>`<div class="card"><b>${x.name}</b><div class="small">${x.start} → ${x.end}</div></div>`).join("")||'<div class="empty">No ongoing contest.</div>'}</div>`;
}
function breakdownV11(title,list){openModal(`<h2>${title} Breakdown</h2><div class="list">${list.map(c=>`<div class="item"><div class="row"><div><b>${c.client}</b><div class="small">${c.product} · ${c.kind||"New Business"}</div></div><b>${money(c.tpc)}</b></div></div>`).join("")||'<div class="empty">No records.</div>'}</div>`)}

function pipeline(){
 let statuses=["To Approach","To Meet Up","To Follow Up","To Submit","To Approve","Inforce"];
 document.getElementById("pipeline").innerHTML=`<div class="section">Sales Pipeline</div><div class="list">${statuses.map(s=>{let x=db.cases.filter(c=>c.status===s);let id="stage_"+s.replaceAll(" ","_");return `<div class="card" onclick="document.getElementById('${id}').classList.toggle('hide')"><div class="row"><b>${s}</b><span class="pill">${x.length}</span></div><div id="${id}" class="hide" style="margin-top:10px"><div class="list">${x.map(c=>`<div class="item" onclick="event.stopPropagation();openCase('${c.id}')"><b>${c.client}</b><div class="small">${c.product} · ${money(c.tpc)} · ${c.kind||"New Business"}</div></div>`).join("")||'<div class="small">No records</div>'}</div></div>`}).join("")}</div>`;
}

function clients(){
 let f=window.clientFilter||{},list=db.cases.filter(c=>(!f.name||c.client.toLowerCase().includes(f.name.toLowerCase()))&&(!f.ic||c.ic.includes(f.ic))&&(!f.group||c.group===f.group)&&(!f.status||c.status===f.status)&&(!f.product||c.product===f.product)),m=new Map(list.map(c=>[c.ic,c]));
 document.getElementById("clients").innerHTML=`<div class="section">Clients</div><div class="card"><div class="searchGrid"><input placeholder="Client Name" value="${f.name||""}" oninput="clientFilter.name=this.value;render()"><input placeholder="Client IC" value="${f.ic||""}" oninput="clientFilter.ic=this.value;render()"><select onchange="clientFilter.group=this.value;render()"><option value="">All Groups</option>${db.settings.groups.map(g=>`<option ${f.group===g?"selected":""}>${g}</option>`).join("")}</select><select onchange="clientFilter.status=this.value;render()"><option value="">All Status</option>${["To Approach","To Meet Up","To Follow Up","To Submit","To Approve","Inforce","Surrender","Lapse","Ceased"].map(s=>`<option ${f.status===s?"selected":""}>${s}</option>`).join("")}</select><select onchange="clientFilter.product=this.value;render()"><option value="">All Products</option>${db.settings.products.map(p=>`<option ${f.product===p?"selected":""}>${p}</option>`).join("")}</select></div></div><div class="section">${m.size} Client(s)</div><div class="list">${[...m.values()].map(c=>`<div class="item"><button class="linkBtn" onclick="profileV11('${c.ic}')">${c.client}</button><div class="small">${c.ic}</div></div>`).join("")||'<div class="empty">No matching clients.</div>'}</div>`;
}
function profileV11(ic){let cs=db.cases.filter(c=>c.ic===ic),c=cs[0],ps=[...new Set(cs.map(x=>x.product))];openModal(`<h2>${c.client}</h2><div class="small">${c.ic} · Group ${c.group||"-"} · ${c.status}</div><div class="section">Client Details</div><div class="card">Name: ${c.client}<br>IC: ${c.ic}<br>Status: ${c.status}</div><div class="section">Products</div><div class="list">${ps.map(p=>`<div class="card"><button class="linkBtn" onclick="document.getElementById('p_${btoa(unescape(encodeURIComponent(p))).replaceAll('=','')}').classList.toggle('hide')">${p}</button><div id="p_${btoa(unescape(encodeURIComponent(p))).replaceAll('=','')}" class="hide" style="margin-top:10px">${cs.filter(x=>x.product===p).map(x=>`<div class="item"><b>${x.kind||"New Business"}</b><div class="small">${dateStr(x.inforce)} · ${x.status} · ${money(x.tpc)}</div><div class="small">${x.benefit||""}</div></div>`).join("")}<div class="pieWrap"><div class="pie"></div></div></div></div>`).join("")}</div><div class="actions"><button class="secondary" onclick="openCase('${c.id}')">Edit</button><button class="danger" onclick="deleteClientV11('${ic}')">Delete</button></div>`)}
function deleteClientV11(ic){if(confirm("Delete this client and linked records?")){db.cases=db.cases.filter(c=>c.ic!==ic);save();closeModal()}}

function settings(){
 document.getElementById("settings").innerHTML=`<div class="section">Settings</div>
 <div class="card"><h3>Products</h3>${db.settings.products.map((p,i)=>`<div class="row" style="margin:8px 0"><span>${p}</span><button class="danger" onclick="settingRemove('products',${i})">Remove</button></div>`).join("")}<button class="secondary" onclick="settingAdd('products','Product name')">＋ Add Product</button></div>
 <div class="card" style="margin-top:10px"><h3>Client Groups</h3><div>${db.settings.groups.join(" · ")}</div><button class="secondary" style="margin-top:10px" onclick="settingAdd('groups','Group')">＋ Add Group</button></div>
 <div class="card" style="margin-top:10px"><h3>Benefits</h3>${db.settings.benefits.map((p,i)=>`<div class="row" style="margin:8px 0"><span>${p}</span><button class="danger" onclick="settingRemove('benefits',${i})">Remove</button></div>`).join("")}<button class="secondary" onclick="settingAdd('benefits','Benefit name')">＋ Add Benefit</button></div>
 
 <div class="card" style="margin-top:10px"><h3>Data</h3><button class="danger" onclick="resetDataV11()">Reset All Data</button></div>`;
}
function settingAdd(k,p){let v=prompt(p);if(v){db.settings[k].push(v);save()}}function settingRemove(k,i){db.settings[k].splice(i,1);save()}
function changePW(){if(prompt("Current password")!==db.settings.password)return alert("Wrong password");let p=prompt("New password");if(p){db.settings.password=p;save();alert("Password changed.")}}
function resetDataV11(){if(prompt("Enter password")!==db.settings.password)return alert("Wrong password");if(confirm("Reset all sales/client/contest data?")){db.cases=[];db.contests=[];save()}}
</script>

</body>
