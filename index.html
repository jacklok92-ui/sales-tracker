<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f6f2">
<title>Sales Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--bg:#f6f5f1;--card:#fff;--text:#20211f;--muted:#777871;--line:#e6e4dd;--accent:#20211f;--green:#4f765c;--red:#a35b52;--yellow:#9a7b38}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC",sans-serif}
.app{max-width:1100px;margin:auto;padding-bottom:90px}.topActions{display:flex;align-items:center;gap:8px}.langBtn{min-width:68px}.top{padding:24px 20px 12px;display:flex;justify-content:space-between;align-items:end;gap:12px}.brand{font-size:24px;font-weight:700}.sub{font-size:12px;color:var(--muted);margin-top:4px}
nav{position:sticky;top:0;z-index:5;background:rgba(246,245,241,.94);backdrop-filter:blur(14px);display:flex;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line);overflow:auto}
nav button{border:0;background:transparent;padding:10px 13px;border-radius:12px;white-space:nowrap;color:var(--muted);font-weight:600}nav button.active{background:#20211f;color:white}
main{padding:16px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}.metric{font-size:25px;font-weight:750;margin-top:6px}.label{font-size:12px;color:var(--muted)}.section{margin:22px 0 10px;font-size:15px;font-weight:750}
.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.stack{display:flex;flex-direction:column;gap:10px}.pill{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:700;background:#eeece6}.pill.green{background:#e6efe8;color:#42644d}.pill.red{background:#f4e5e2;color:#914d45}.pill.yellow{background:#f3ecd8;color:#82692c}
button.primary{background:#20211f;color:#fff;border:0;border-radius:12px;padding:11px 15px;font-weight:700}button.secondary{background:white;border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-weight:650}button.danger{background:#f4e5e2;color:#914d45;border:0;border-radius:12px;padding:10px 14px;font-weight:650}.linkBtn{border:0;background:none;padding:0;text-align:left;font:inherit;font-weight:700;color:inherit;cursor:pointer}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid #dcdad2;border-radius:11px;background:white;font:inherit}textarea{min-height:80px}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}.full{grid-column:1/-1}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.list{display:flex;flex-direction:column;gap:9px}.item{background:white;border:1px solid var(--line);border-radius:15px;padding:14px}.small{font-size:12px;color:var(--muted)}.right{text-align:right}.hide{display:none}.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed #d8d6ce;border-radius:16px}
.menuGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.menuBtn{background:white;border:1px solid var(--line);border-radius:18px;padding:22px;text-align:left;font-weight:750;font-size:16px}.menuBtn span{display:block;color:var(--muted);font-size:12px;font-weight:500;margin-top:6px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:20;padding:12px;overflow:auto}.modalBox{background:var(--bg);max-width:760px;margin:30px auto;border-radius:22px;padding:18px}
.benefitBox{background:#faf9f5;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}.coverageGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}
.searchGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.chart{height:190px;position:relative;margin-top:8px}.barChart{position:relative;height:190px;display:flex;align-items:end;gap:5px;border-bottom:1px solid var(--line);padding:10px 4px}.bar{background:#20211f;border-radius:4px 4px 0 0;min-width:6px;flex:1}.pieWrap{display:flex;align-items:center;gap:16px;justify-content:center;margin:12px 0}.pie{width:130px;height:130px;border-radius:50%;background:conic-gradient(#20211f 0 45%,#777871 45% 72%,#b7b4aa 72% 100%)}.legend{font-size:12px;color:var(--muted)}.legend div{margin:5px 0}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#20211f;color:white;padding:11px 16px;border-radius:12px;z-index:50;font-size:13px}
@media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}.grid3{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.top{padding:20px 16px 10px}main{padding:12px}.metric{font-size:21px}.menuGrid{grid-template-columns:1fr}.searchGrid{grid-template-columns:1fr 1fr}.coverageGrid{grid-template-columns:1fr}}

.rangeRow{display:grid;grid-template-columns:1fr 1fr;gap:8px}.chartCard{padding:14px}.svgChart{width:100%;height:250px;display:block}.chartValue{font-size:10px;fill:var(--muted);font-weight:650}.chartLegend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:6px}.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:#20211f;margin-right:4px}.barLegend{background:#777871}.importHint{background:#faf9f5;border:1px dashed #d6d3ca;border-radius:12px;padding:12px;font-size:12px;color:var(--muted)}
@media(max-width:760px){.rangeRow{grid-template-columns:1fr}}

/* V1.13.1 modern tech UI */
:root{--bg:#f4f7fb;--card:#ffffff;--line:#dfe6ef;--text:#111827;--muted:#667085;--accent:#2563eb;--accent2:#7c3aed;--shadow:0 10px 30px rgba(15,23,42,.08)}
body{background:radial-gradient(circle at 15% 0%,rgba(37,99,235,.08),transparent 30%),radial-gradient(circle at 90% 10%,rgba(124,58,237,.07),transparent 28%),var(--bg);color:var(--text)}
.app{max-width:1120px;margin:auto}.top{border-bottom:1px solid rgba(223,230,239,.8);backdrop-filter:blur(18px);background:rgba(244,247,251,.82);position:sticky;top:0;z-index:10}.brand{letter-spacing:-.02em}.card{background:rgba(255,255,255,.88);border:1px solid rgba(223,230,239,.9);box-shadow:var(--shadow);border-radius:18px;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}.card[role=button],.card[onclick]{cursor:pointer}.card[role=button]:hover,.card[onclick]:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(15,23,42,.12);border-color:rgba(37,99,235,.25)}
button.primary{background:linear-gradient(135deg,#2563eb,#7c3aed);box-shadow:0 8px 18px rgba(37,99,235,.2)}button.secondary{background:#f8fafc;border-color:#d9e2ec}nav{background:rgba(255,255,255,.72);border:1px solid var(--line);box-shadow:0 6px 20px rgba(15,23,42,.05);border-radius:16px;padding:5px}nav button{border-radius:11px}.metric{letter-spacing:-.04em}.section{font-weight:800;letter-spacing:-.02em}.modal{background:rgba(15,23,42,.48);backdrop-filter:blur(8px)}.modalBox{box-shadow:0 24px 70px rgba(15,23,42,.22);border:1px solid rgba(255,255,255,.6)}.chartCard{box-shadow:var(--shadow)}.svgChart{height:280px}.chartValue{font-size:10px;fill:var(--text);font-weight:750}.aiCoach{background:linear-gradient(135deg,rgba(37,99,235,.08),rgba(124,58,237,.08));border-color:rgba(99,102,241,.22)}.aiBadge{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;color:#4f46e5;background:#eef2ff;border:1px solid #c7d2fe;border-radius:999px;padding:5px 9px}.coachAction{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.coachAction button{font-size:12px;padding:8px 10px}


.coverageHero{background:linear-gradient(135deg,rgba(37,99,235,.10),rgba(124,58,237,.10));border:1px solid rgba(99,102,241,.18);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.coverageKpi{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.coverageKpi .card{box-shadow:none;background:rgba(255,255,255,.7)}
.gapNum{font-size:26px;font-weight:850;letter-spacing:-.04em}.coverageMini{font-size:11px;color:var(--muted);margin-top:4px}.coverageSection{margin-top:16px}.coverageSlider{display:grid;grid-template-columns:1fr 80px;gap:10px;align-items:center}.coverageSlider input[type=range]{padding:0;border:0}.coveragePill{display:inline-flex;padding:5px 9px;border-radius:999px;background:#eef2ff;color:#4f46e5;font-size:11px;font-weight:800}
@media(max-width:760px){.coverageKpi{grid-template-columns:1fr}}
.filterBtn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:10px 14px;font-weight:700;cursor:pointer}.filterBtn:active{transform:scale(.98)}.filterModal{display:flex;flex-direction:column;gap:18px}.filterGroup{padding:12px 0;border-bottom:1px solid var(--line)}.checkGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}.checkRow{display:flex;align-items:center;gap:8px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:13px;cursor:pointer}.checkRow input{width:17px;height:17px;accent-color:var(--accent)}@media(max-width:640px){.checkGrid{grid-template-columns:1fr}}
.behaviourCompact{display:grid;grid-template-columns:1.25fr 1fr;gap:12px}.behHero{background:linear-gradient(135deg,rgba(37,99,235,.12),rgba(124,58,237,.10) 55%,rgba(79,118,92,.12));border:1px solid rgba(99,102,241,.18);box-shadow:var(--shadow);border-radius:22px;padding:18px}.behRing{width:82px;height:82px;border-radius:50%;background:conic-gradient(#4f46e5 var(--pct),rgba(148,163,184,.18) 0);display:grid;place-items:center}.behRing:after{content:'';width:62px;height:62px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 1px var(--line)}.behRingWrap{position:relative}.behRingText{position:absolute;inset:0;display:grid;place-items:center;font-weight:850;font-size:15px}.behMiniGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.behMini{background:rgba(255,255,255,.66);border:1px solid rgba(148,163,184,.2);border-radius:15px;padding:11px}.behMini .big{font-size:21px;font-weight:850;margin-top:3px}.behBar{height:6px;border-radius:99px;background:rgba(148,163,184,.16);overflow:hidden;margin-top:7px}.behBar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#4f46e5,#7c3aed)}.behActionList{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}.behActionRow{padding:11px 12px;border:1px solid var(--line);border-radius:14px;background:var(--card);display:flex;justify-content:space-between;align-items:center}.behActionRow b{font-size:13px}.behActionRow .count{font-size:18px;font-weight:850}.behToday{margin-top:12px;padding:12px;border-radius:15px;background:rgba(255,255,255,.62);border:1px solid rgba(148,163,184,.2)}.behCheckLine{display:flex;align-items:center;gap:8px;font-size:12px}.behCheckLine span{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:#e8edf0;color:#69727a;font-weight:900}.behCheckLine.done span{background:#2f7d52;color:#fff}.behReview{margin-top:12px}.behReviewNote{font-size:12px;color:var(--muted);line-height:1.55}.uiGlow{position:relative;overflow:hidden}.uiGlow:before{content:'';position:absolute;inset:-40% 35% 40% -20%;background:radial-gradient(circle,rgba(99,102,241,.14),transparent 62%);pointer-events:none}.brandWrap{display:flex;align-items:center;gap:12px}.appLogo{width:46px;height:46px;border-radius:13px;object-fit:cover;box-shadow:0 8px 20px rgba(15,23,42,.16);flex:0 0 auto}@media(max-width:760px){.appLogo{width:42px;height:42px;border-radius:12px}}.top{padding-top:28px}.brand{letter-spacing:-.04em}.card{box-shadow:0 10px 30px rgba(15,23,42,.045);transition:transform .18s,box-shadow .18s,border-color .18s}.card:hover{box-shadow:0 14px 34px rgba(15,23,42,.08);border-color:rgba(99,102,241,.18)}nav{margin:0 12px;border:1px solid var(--line);border-radius:18px;padding:7px;background:rgba(255,255,255,.62);box-shadow:0 8px 25px rgba(15,23,42,.05)}nav button{padding:10px 14px;border-radius:12px}nav button.active{background:linear-gradient(135deg,#20211f,#4b5563);box-shadow:0 5px 14px rgba(15,23,42,.18)}button.primary{background:linear-gradient(135deg,#20211f,#3f4650);box-shadow:0 6px 14px rgba(15,23,42,.14)}.section{letter-spacing:-.01em}.metric{letter-spacing:-.045em}@media(max-width:760px){.behaviourCompact{grid-template-columns:1fr}.behMiniGrid{grid-template-columns:repeat(2,1fr)}.behActionList{grid-template-columns:1fr}.top{padding-top:20px}nav{margin:0 8px}}
.settingSwipeWrap{position:relative;margin:7px 0;border-radius:16px;overflow:hidden;background:#f2d9d5}.settingSwipeRemove{position:absolute;inset:0 0 0 auto;width:88px;border:0;background:#d94b3f;color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}.settingSortRow{position:relative;z-index:2;display:flex;align-items:center;gap:10px;padding:13px 12px;border:1px solid var(--line);border-radius:16px;background:var(--card);touch-action:pan-y;user-select:none;-webkit-user-select:none;transition:transform .18s ease,opacity .18s ease,box-shadow .18s ease;min-height:58px}.settingSortRow.dragging{opacity:.82;box-shadow:0 14px 30px rgba(15,23,42,.16);transform:scale(1.02);transition:none}.settingSortRow.swiped{transform:translateX(-88px)}.dragHandle{font-size:22px;line-height:1;color:var(--muted);cursor:grab;min-width:26px;text-align:center;touch-action:none}.settingName{flex:1;min-width:0;line-height:1.25;padding-right:4px}.settingSortRow.dropTarget{box-shadow:inset 0 3px 0 var(--accent),inset 0 -3px 0 var(--accent)}@media(max-width:760px){.settingSortRow{padding:13px 12px}.dragHandle{font-size:23px}.settingSwipeRemove{width:88px}}

.coverageSwipeWrap{position:relative;margin:7px 0;border-radius:16px;overflow:hidden;background:#f2d9d5}
.coverageSwipeRemove{position:absolute;inset:0 0 0 auto;width:92px;border:0;background:#d94b3f;color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;z-index:1}
.coverageSwipeRow{position:relative;z-index:2;border:1px solid var(--line);border-radius:16px;background:var(--card);touch-action:pan-y;user-select:none;-webkit-user-select:none;transition:transform .18s ease;cursor:pointer}
.coverageSwipeRow.swiped{transform:translateX(-92px)}
.coverageSwipeRow.swiping{transition:none}

<style id="v15-tech-ui">
/* V1.15.3 — FUTURE OPS / TECH UI
   Visual-only redesign. Existing markup, data and interactions are preserved. */
:root{
  --bg:#070a10;
  --bg2:#0b1018;
  --card:rgba(16,22,32,.82);
  --card2:rgba(20,28,40,.72);
  --text:#eef4ff;
  --muted:#8d9aae;
  --line:rgba(148,163,184,.16);
  --accent:#63e6ff;
  --accent2:#8b7cff;
  --green:#55e6a5;
  --red:#ff6f91;
  --yellow:#ffd166;
  --shadow:0 18px 50px rgba(0,0,0,.34);
  --glow:0 0 32px rgba(99,230,255,.10);
}
*{box-sizing:border-box}
html{background:#070a10;scroll-behavior:smooth}
body{
  margin:0;color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","PingFang SC",Inter,sans-serif;
  background:
    radial-gradient(circle at 12% -5%,rgba(99,230,255,.14),transparent 28%),
    radial-gradient(circle at 92% 8%,rgba(139,124,255,.14),transparent 30%),
    radial-gradient(circle at 50% 70%,rgba(45,212,191,.045),transparent 34%),
    linear-gradient(180deg,#070a10 0%,#0a0f17 48%,#070a10 100%);
  min-height:100vh;
  color-scheme:dark;
}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:.34;
  background-image:linear-gradient(rgba(99,230,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(99,230,255,.035) 1px,transparent 1px);
  background-size:32px 32px;
  mask-image:linear-gradient(to bottom,rgba(0,0,0,.9),transparent 88%);
}
body:after{
  content:"";position:fixed;left:0;right:0;top:0;height:1px;z-index:999;pointer-events:none;
  background:linear-gradient(90deg,transparent,var(--accent),var(--accent2),transparent);opacity:.75;
  box-shadow:0 0 18px rgba(99,230,255,.65);
}
.app{max-width:1180px;margin:auto;padding:0 16px 110px}
.top{
  margin:0 -16px;padding:22px 20px 16px;min-height:86px;
  display:flex;justify-content:space-between;align-items:center;gap:16px;
  position:sticky;top:0;z-index:10;
  background:rgba(7,10,16,.76);backdrop-filter:blur(24px) saturate(140%);
  border-bottom:1px solid rgba(99,230,255,.10);
  box-shadow:0 12px 35px rgba(0,0,0,.18);
}

<style id="v15-layout-refresh">
/* V1.15.3 — Light Future / Editorial Fintech layout refresh */
:root{
  --bg:#f3f6fb;
  --card:#ffffff;
  --card-soft:rgba(255,255,255,.78);
  --text:#101828;
  --muted:#667085;
  --line:#e4e9f1;
  --accent:#2878f0;
  --accent2:#8068ef;
  --success:#159a72;
  --shadow:0 10px 35px rgba(31,50,81,.07);
  --shadow2:0 18px 55px rgba(31,50,81,.10);
}
html{background:var(--bg)}
body{
  min-height:100vh;
  background:
    radial-gradient(900px 420px at 8% -5%,rgba(71,145,255,.13),transparent 62%),

    linear-gradient(180deg,#f7f9fc 0%,#f2f5fa 48%,#eef3f9 100%);
  color:var(--text);
}
.app{max-width:1180px;padding:0 14px 110px}
.top{
  position:sticky;top:0;z-index:20;
  margin:0 -14px;
  padding:16px 18px 12px;
  background:rgba(247,249,252,.78);
  border-bottom:1px solid rgba(228,233,241,.75);
  backdrop-filter:blur(24px) saturate(150%);
  -webkit-backdrop-filter:blur(24px) saturate(150%);
  align-items:center;
}
.top:after{display:none}
.brandWrap{gap:11px}.appLogo{width:40px;height:40px;border-radius:12px;box-shadow:0 8px 24px rgba(40,120,240,.14)}
.brand{font-size:21px;font-weight:780;letter-spacing:-.045em}.sub{font-size:11px;letter-spacing:.02em;color:#7a8696;margin-top:2px}
.topActions{gap:7px}.topActions button{min-height:38px}
.topActions .secondary{background:rgba(255,255,255,.65);border:1px solid rgba(220,227,237,.9);box-shadow:0 4px 12px rgba(31,50,81,.04)}
button.primary{background:linear-gradient(135deg,#2878f0,#7d67ed);box-shadow:0 9px 22px rgba(70,111,224,.20);border-radius:13px}
nav{

  margin:9px 0 4px;
  padding:5px;
  display:flex;gap:4px;
  border:1px solid rgba(255,255,255,.88);
  border-radius:19px;
  background:rgba(255,255,255,.70);
  box-shadow:0 9px 28px rgba(31,50,81,.07),inset 0 1px 0 rgba(255,255,255,.9);
  backdrop-filter:blur(22px) saturate(150%);
  -webkit-backdrop-filter:blur(22px) saturate(150%);
}

  margin:27px 2px 10px;

  color:#66758a;display:flex;align-items:center;gap:9px;
}

  background:rgba(255,255,255,.84);

  transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;
}

.formgrid{gap:14px}.field label{font-size:11px;font-weight:700;color:#738095;letter-spacing:.02em}
input,select,textarea{background:rgba(255,255,255,.86);border:1px solid #dfe5ee;border-radius:14px;padding:12px 13px;box-shadow:inset 0 1px 2px rgba(31,50,81,.02);outline:none;transition:border-color .16s,box-shadow .16s,background .16s}

button.danger{border-radius:13px}
.chartCard{border-radius:22px;background:rgba(255,255,255,.84);box-shadow:var(--shadow);padding:17px}.svgChart{height:250px}

.coverageKpi{gap:11px}.coverageKpi .card{border-radius:18px;background:rgba(255,255,255,.78)}
.coverageSection{margin-top:18px}.benefitBox,.coverageCurrent,.selectedClient,.searchFieldWrap,.currentMedicalList,.clientDetailCard,.benefitSummary,.profileProduct{background:rgba(255,255,255,.80);border-color:#e0e6ef;border-radius:18px}
.searchFieldWrap{padding:0 13px}.searchFieldWrap input{background:transparent}
.profileProductHeader{padding:17px}.profileProductName{font-size:16px}
.modal{background:rgba(31,48,73,.24);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.modalBox{background:rgba(247,249,252,.94);border:1px solid rgba(255,255,255,.9);border-radius:26px;box-shadow:0 28px 80px rgba(20,37,61,.20);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)}
.toast{background:rgba(16,24,40,.90);border-radius:14px;box-shadow:0 12px 30px rgba(16,24,40,.2)}
/* Make behavior tracker feel like a dashboard, not a form. */
.behaviourCompact{gap:13px}.behMini{border-radius:17px;background:rgba(255,255,255,.72);border-color:#e1e7ef}.behActionRow{border-radius:16px;background:rgba(255,255,255,.76);border-color:#e1e7ef}.behToday{border-radius:17px;background:rgba(255,255,255,.70);border-color:#e1e7ef}
/* Saved analysis / swipe cards */
.swipeCard,.analysisCard{border-radius:19px;background:rgba(255,255,255,.84);border:1px solid var(--line);box-shadow:0 7px 24px rgba(31,50,81,.055)}
/* Reduce visual noise in dense data screens. */
.searchGrid{gap:10px}.filterBtn{border-radius:13px;background:rgba(255,255,255,.82)}
.empty{background:rgba(255,255,255,.48);border-color:#dce3ec;padding:34px;border-radius:20px}
@media(max-width:760px){
  .app{padding-left:10px;padding-right:10px}.top{margin:0 -10px;padding:14px 13px 10px}.topActions .langBtn{min-width:54px;padding:8px 9px}.topActions .primary{padding:9px 11px}
  nav{top:62px;margin:7px 0 2px;border-radius:17px;overflow-x:auto;scroll-snap-type:x proximity}.section{margin-top:23px}.card{border-radius:19px;padding:16px}.metric{font-size:27px}
  #home>.grid:nth-of-type(1),#home>.grid:nth-of-type(2){grid-template-columns:1fr 1fr}.menuGrid{grid-template-columns:1fr 1fr}
}
@media(max-width:520px){
  main{padding-top:18px}.brand{font-size:19px}.sub{font-size:10px}.appLogo{width:38px;height:38px}.topActions .secondary.langBtn{display:none}

<script>
const PRODUCT_CANON={"basic term assurance":"Basic Term Assurance","pru88":"PRU88","prucash assurance with profits":"PRUCash Assurance With Profits","prucash double reward":"PRUCash Double Reward","prucash enrich":"PRUCash Enrich","prudential protection plus policy 70%":"Prudential Protection Plus Policy 70%","pruelite invest":"PRUElite Invest","prugrowth":"PRUGrowth","prulady":"PRUlady","prulady term assurance":"PRULady Term Assurance","prulife ready":"PRULife Ready","prulink":"PRULink","prulink assurance account":"PRULink Assurance Account","prulink assurance plan":"PRULink Assurance Plan","prulink investor account":"PRULink Investor Account","prulink million":"PRULink Million","prulink one":"PRULink One","prumy child":"PRUMy Child","prusave assurance with profits":"PRUSave Assurance With Profits","pruvantage":"PRUVantage","pruwealth":"PRUWealth","pruwealth enrich":"PRUWealth Enrich","pruwealth enrich 2.0":"PRUWealth Enrich 2.0","pruwealth max":"PRUWealth Max","pruwealth plus":"PRUWealth Plus","pruwith you":"PRUWith You","pruwith you plus":"PRUWith You Plus"};
const KEY='salesTrackerV14';
const defaults={
 products:["Basic Term Assurance","PRU88","PRUCash Assurance With Profits","PRUCash Double Reward","PRUCash Enrich","Prudential Protection Plus Policy 70%","PRUElite Invest","PRUGrowth","PRUlady","PRULady Term Assurance","PRULife Ready","PRULink","PRULink Assurance Account","PRULink Assurance Plan","PRULink Investor Account","PRULink Million","PRULink One","PRUMy Child","PRUSave Assurance With Profits","PRUVantage","PRUWealth","PRUWealth Enrich","PRUWealth Enrich 2.0","PRUWealth Max","PRUWealth Plus","PRUWith You","PRUWith You Plus"],
 groups:["A","B","C","D"],
 benefits:["Death / TPD","TMCC","43 CI","Acci Death / TPD","Acci Medical Reimbursement (per case)","Medical Card","Payor"],
 rates:[.25,.25,.135,.185,.15,.15],theme:"ivory"
};
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{cases:[],clients:[],contests:[],settings:structuredClone(defaults)};
db.cases=db.cases||[];db.clients=db.clients||[];db.contests=db.contests||[];db.coverageAnalyses=db.coverageAnalyses||[];db.behaviourTracker=db.behaviourTracker||{targets:{},logs:[]};db.behaviourTracker.targets=db.behaviourTracker.targets||{};db.behaviourTracker.logs=db.behaviourTracker.logs||[];
db.settings={...structuredClone(defaults),...(db.settings||{})};
let appLang=localStorage.getItem('salesTrackerLang')||'zh';
function applyTheme(){const themes={ivory:{bg:'#f6f5f1',card:'#fff',text:'#20211f',muted:'#777871',line:'#e6e4dd',accent:'#20211f'},dark:{bg:'#171817',card:'#232523',text:'#f5f5f2',muted:'#a9aaa4',line:'#3a3c39',accent:'#f5f5f2'},sage:{bg:'#eef2ed',card:'#ffffff',text:'#203027',muted:'#66736b',line:'#d6dfd8',accent:'#365843'},slate:{bg:'#eef1f4',card:'#ffffff',text:'#1e2933',muted:'#687582',line:'#d7dde2',accent:'#334b5e'},sand:{bg:'#f5efe6',card:'#fffaf3',text:'#2d2924',muted:'#7c7267',line:'#e4d9cb',accent:'#5b4b3a'}};const t=themes[db.settings.theme]||themes.ivory;document.documentElement.style.setProperty('--bg',t.bg);document.documentElement.style.setProperty('--card',t.card);document.documentElement.style.setProperty('--text',t.text);document.documentElement.style.setProperty('--muted',t.muted);document.documentElement.style.setProperty('--line',t.line);document.documentElement.style.setProperty('--accent',t.accent);document.querySelector('meta[name="theme-color"]')?.setAttribute('content',t.bg)}
applyTheme();
db.settings.products=[...new Set([...(defaults.products||[]),...(db.settings.products||[])].map(normalizeProduct).filter(Boolean))];
for(const k of ['products','groups','benefits']) if(!Array.isArray(db.settings[k])) db.settings[k]=structuredClone(defaults[k]);
// Normalize imported/existing product names so product codes in trailing parentheses
// never create separate products in Sales, Clients, Contest or Settings.
db.settings.products=[...new Set(db.settings.products.map(normalizeProduct).filter(Boolean))];
db.cases.forEach(c=>{ if(c.product)c.product=normalizeProduct(c.product); if(c.type)c.type=normalizeProduct(c.type); });
db.contests.forEach(c=>{ if(c.type && c.type!=='Any') c.type=normalizeProduct(c.type); });
localStorage.setItem(KEY,JSON.stringify(db));
// Keep Settings > Products synchronized with products imported from Excel/RAISe.
const importedProducts=[...new Set(db.cases.map(c=>c.product||c.type).filter(Boolean))];
importedProducts.forEach(p=>{if(!db.settings.products.includes(p)) db.settings.products.push(p)});
function normalizeStatus(v){
 let s=String(v||'').trim();
 let m={'INFORCE':'Inforce','LAPSED':'Lapse','LAPSE':'Lapse','CANCELLED':'Ceased','CANCELED':'Ceased','SURRENDER':'Surrender','CEASED':'Ceased','DEATH CLAIM APPROVED':'Ceased','ENDORSEMENT IN PROGRESS':'Inforce','TO APPROACH':'To Approach','TO MEET UP':'To Meet Up','TO FOLLOW UP':'To Follow Up','TO SUBMIT':'To Submit','TO APPROVE':'To Approve'};
 return m[s.toUpperCase()]||s;
}
// Normalize imported/existing records so RAISe values such as INFORCE/LAPSED/CANCELLED
// participate in the same calculations and filters as manually keyed records.
db.cases.forEach(c=>{if(c.status)c.status=normalizeStatus(c.status); if(c.clientStatus)c.clientStatus=normalizeStatus(c.clientStatus);});
function normalizeProduct(v){
 let s=String(v||'').trim();
 s=s.replace(/\s*\([^()]*\)\s*$/,'').trim();
 let k=s.replace(/\s+/g,' ').toLowerCase();
 return PRODUCT_CANON[k]||s;
}
function allProducts(){
 return [...new Set([...db.settings.products,...db.cases.map(c=>normalizeProduct(c.product||c.type)).filter(Boolean)])];
}

function normalizeHeader(v){return String(v||'').toLowerCase().replace(/[\s_\-\/()]+/g,'').replace(/[^\w\u4e00-\u9fff]/g,'')}
function clientRecords(){
 const m=new Map();
 db.clients.forEach(c=>m.set(c.ic||c.client,c));
 db.cases.forEach(c=>{let k=c.ic||c.client;if(!m.has(k))m.set(k,{client:c.client,ic:c.ic,group:c.group||'',clientStatus:c.clientStatus||''})});
 return [...m.values()].sort((a,b)=>String(a.client||'').localeCompare(String(b.client||''),undefined,{sensitivity:'base'}));
}
function upsertClient(c){
 if(!c.ic && !c.client)return;
 let key=c.ic||c.client, i=db.clients.findIndex(x=>(x.ic||x.client)===key);
 if(i>=0) db.clients[i]={...db.clients[i],...c}; else db.clients.push(c);
}

function save(){localStorage.setItem(KEY,JSON.stringify(db));render();if(window.cloudReady)window.cloudScheduleSync?.()}
function money(n){return 'RM '+Number(n||0).toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2})}
function dateStr(d){return d?new Date(d+'T00:00:00').toLocaleDateString('en-MY',{day:'2-digit',month:'short',year:'numeric'}):'-'}
function monthKey(d=new Date()){let x=new Date(d);return `${x.getFullYear()}-${pad2(x.getMonth()+1)}`}
function pad2(n){return String(n).padStart(2,'0')}
function iso(d){let x=new Date(d);return `${x.getFullYear()}-${pad2(x.getMonth()+1)}-${pad2(x.getDate())}`}
function localDateTime(d=Date.now()){const x=new Date(d);return new Intl.DateTimeFormat('en-MY',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(x)}
function localDateTimeShort(d=Date.now()){const x=new Date(d);return new Intl.DateTimeFormat('en-MY',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:true}).format(x)}
function analysisDateTime(x){if(x?.createdAt)return localDateTimeShort(x.createdAt);if(x?.timestamp)return localDateTimeShort(x.timestamp);if(x?.date&&/^\d{4}-\d{2}-\d{2}$/.test(String(x.date)))return dateStr(x.date);return x?.date?String(x.date):'Saved analysis'}
function annual(c){return c.payMode==='monthly'?+c.premium*12:c.payMode==='quarterly'?+c.premium*4:c.payMode==='halfyearly'?+c.premium*2:+c.premium}
function tpc(c){return +c.tpc||annual(c)}
function factor(c){return c.term==='10'?.5:c.term==='5'?.25:1}
function duration(c){return c.term==='5'?5:6}
function eligible(c){return normalizeStatus(c.status)==='Inforce'}
function cycleStart(c){return c.commissionStart||c.inforce}
function monthlyComm(c,date){
 if(!eligible(c))return 0;
 let start=new Date(cycleStart(c)+'T00:00:00'), d=new Date(date+'T00:00:00');
 let m=Math.floor((d.getFullYear()-start.getFullYear())*12+d.getMonth()-start.getMonth())+1;
 if(m<1||m>duration(c)*12)return 0;
 let y=Math.ceil(m/12), yearly=tpc(c)*db.settings.rates[y-1]*factor(c);
 return c.payMode==='monthly'?yearly/12:c.payMode==='quarterly'?(m%3===1?yearly/4:0):c.payMode==='halfyearly'?(m%6===1?yearly/2:0):(m===((y-1)*12+1)?yearly:0);
}
function show(id,btn){document.querySelectorAll('main section').forEach(x=>x.classList.add('hide'));document.getElementById(id).classList.remove('hide');document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));btn.classList.add('active');render()}
function closeModal(){document.querySelectorAll('.modal').forEach(x=>x.remove())}
function modal(title,body,wide=false){let el=document.createElement('div');el.className='modal';el.innerHTML=`<div class="modalBox" style="${wide?'max-width:900px':''}"><div class="row"><h2 style="margin:4px 0 14px">${title}</h2><button class="secondary" onclick="this.closest('.modal').remove()">Close</button></div>${body}</div>`;document.body.appendChild(el);return el}
function toast(t){let e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),1800)}
const TXT={zh:{home:'首页',pipeline:'Pipeline',sales:'Sales',clients:'客户',coverage:'保障计算',contest:'竞赛',income:'收入',settings:'设置',newCase:'＋ 新增 Case',coach:'AI Coach',coachTitle:'今日 Coach',ask:'问 Coach',askPlaceholder:'例如：我这个月应该先做什么？',production:'Production Overview · 当月',existing:'Existing Portfolio',activeImported:'Active Imported Policies',estimatedMonthly:'Estimated Monthly Income',ongoing:'Ongoing Contests'},en:{home:'Home',pipeline:'Pipeline',sales:'Sales',clients:'Clients',coverage:'Coverage',contest:'Contest',income:'Income',settings:'Settings',newCase:'＋ New Case',coach:'AI Coach',coachTitle:"Today's Coach",ask:'Ask Coach',askPlaceholder:'e.g. What should I focus on this month?',production:'Production Overview · Current Month',existing:'Existing Portfolio',activeImported:'Active Imported Policies',estimatedMonthly:'Estimated Monthly Income',ongoing:'Ongoing Contests'}};
function L(k){return (TXT[appLang]||TXT.en)[k]||k}
function toggleLang(){appLang=appLang==='zh'?'en':'zh';localStorage.setItem('salesTrackerLang',appLang);render()}
function render(){applyTheme();document.getElementById('brandSub').textContent='Insurance CRM · V2.0 Cloud';document.getElementById('newCaseBtn').textContent=L('newCase');const labels=['home','pipeline','sales','clients','coverage','contest','income','settings'];document.querySelectorAll('#nav button').forEach((b,i)=>b.textContent=L(labels[i]));[['home',home],['pipeline',pipeline],['sales',sales],['clients',clients],['coverage',coverage],['contest',contest],['income',income],['settings',settings]].forEach(([id,fn])=>{try{fn()}catch(err){console.error('Sales Tracker render error in '+id,err);const el=document.getElementById(id);if(el)el.innerHTML='<div class="card"><b>'+id+' failed to load</b><div class="small" style="margin-top:8px">Please refresh the app. Other sections remain available.</div></div>'}})}

function startCase(){modal('New Case',`<div class="menuGrid"><button class="menuBtn" onclick="chooseNB()">New Business<span>New policy / new sale</span></button><button class="menuBtn" onclick="chooseTU()">Top Up<span>Upgrade an existing policy</span></button></div>`)}
function chooseNB(){modal('New Business',`<div class="menuGrid"><button class="menuBtn" onclick="caseForm('new')">New Client<span>Enter client details</span></button><button class="menuBtn" onclick="existingPicker('new')">Existing Client<span>Select an existing client</span></button></div>`)}
function chooseTU(){existingPicker('topup')}
function existingPicker(mode){
 let html=`<div class="field"><label>Client Name</label><input id="clientSearch" placeholder="Type existing client name" oninput="suggestClients('${mode}')"><div id="suggestions" class="list" style="margin-top:8px"></div></div>`;
 modal(mode==='topup'?'Top Up · Select Client':'New Business · Existing Client',html)
}
function suggestClients(mode){
 let q=(document.getElementById('clientSearch').value||'').toLowerCase(), rows=clientRecords().filter(c=>String(c.client||'').toLowerCase().includes(q)||String(c.ic||'').includes(q));
 document.getElementById('suggestions').innerHTML=rows.slice(0,20).map(c=>`<button class="secondary" onclick="caseForm('${mode==='new'?'existing':mode}','${c.ic||''}')">${c.client} · ${c.ic||'-'}</button>`).join('')||'<div class="small">No matching existing client.</div>';
}
function benefitFields(existing={}){
 return db.settings.benefits.map(b=>{
  if(b==='Medical Card') return `<div class="benefitBox"><b>Medical Card</b><div class="coverageGrid"><input name="med_plan" placeholder="Medical Plan Name" value="${existing.med_plan||''}"><input name="med_limit" type="number" placeholder="Annual Limit" value="${existing.med_limit||''}"><input name="med_whole" type="number" placeholder="Whole Life Limit" value="${existing.med_whole||''}"><input name="med_room" type="number" placeholder="Room & Board" value="${existing.med_room||''}"><input name="med_deduct" type="number" placeholder="Deductible / Med Saver" value="${existing.med_deduct||''}"></div></div>`;
  if(b==='Payor') return `<div class="benefitBox"><label><input style="width:auto" type="checkbox" name="payor" ${existing.payor?'checked':''}> Payor</label></div>`;
  let key='b_'+b.replace(/[^a-zA-Z0-9]/g,'_');
  return `<div class="benefitBox"><div class="row"><b>${b}</b><input style="max-width:220px" name="${key}" type="number" step=".01" placeholder="Coverage Amount" value="${existing[key]||''}"></div></div>`;

function saveCaseForm(e,mode,reduceId){
 e.preventDefault();
 let fd=new FormData(e.target),o=Object.fromEntries(fd.entries());
 const editingId=reduceId||'';
 const existing=editingId?db.cases.find(c=>String(c.id)===String(editingId)):null;
 const oldStatus=existing?normalizeStatus(existing.status):'To Approach';
 const newStatus=normalizeStatus(o.status||oldStatus);
 o.status=newStatus;
 o.product=normalizeProduct(o.product);
 o.id=editingId||Date.now().toString();
 o.premium=+o.premium||0;
 o.tpc=+o.tpc||0;
 o.benefit=JSON.stringify(parseBenefits(fd));
 // Preserve the original case type when editing an existing pipeline record.
 o.kind=existing?(existing.kind||'New Business'):(mode==='topup'?'Top Up':mode==='reduce'?'Reduce':'New Business');
 if(existing){
   o.commissionStart=existing.commissionStart||existing.inforce||'';
   o.parentId=existing.parentId||'';
 }
 upsertClient({client:o.client,ic:o.ic,group:o.group,clientStatus:o.status});
 if(mode==='topup'&&!existing){
   let parent=db.cases.find(c=>(c.client===o.client&&c.product===o.parentPolicy)||c.product===o.parentPolicy);
   o.commissionStart=o.inforce;
   o.parentId=parent?.id||'';
 }
 if(existing){
   const merged={...existing,...o,status:newStatus};
   if(oldStatus!==newStatus){try{behaviourRecordTransition(oldStatus,newStatus,merged,behaviourDate(new Date()));}catch(err){console.error('Vital Behaviour record failed',err);}}
   const idx=db.cases.findIndex(c=>String(c.id)===String(editingId));
   if(idx>=0) db.cases[idx]=merged;
 }else{
   db.cases.push(o);
   if(newStatus!=='To Approach'){try{behaviourRecordTransition('To Approach',newStatus,o,behaviourDate(new Date()));}catch(err){console.error('Vital Behaviour record failed',err);}}
 }
 localStorage.setItem(KEY,JSON.stringify(db));
 if(window.cloudReady)window.cloudScheduleSync?.();
 closeModal();

}

 const caseId=String(caseObj.id||'');
 const duplicate=logs.some(x=>x.date===date&&x.action===action&&caseId&&String(x.caseId||'')===caseId);
 if(duplicate)return;
 logs.push({id:'beh_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),date,action,caseId,client:caseObj.client||'',product:normalizeProduct(caseObj.product||caseObj.type||'')});

}

let coverageSwipe={row:null,startX:0,startY:0,swiping:false};
function coverageSwipeStart(e){
 if(e.pointerType!=='touch')return;
 const row=e.currentTarget;
 document.querySelectorAll('.coverageSwipeRow.swiped').forEach(r=>{if(r!==row)r.classList.remove('swiped')});
 coverageSwipe={row,startX:e.clientX,startY:e.clientY,swiping:false};
}
function coverageSwipeMove(e){
 if(e.pointerType!=='touch'||coverageSwipe.row!==e.currentTarget)return;
 const dx=e.clientX-coverageSwipe.startX,dy=e.clientY-coverageSwipe.startY;
 if(Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy)*1.2){
  coverageSwipe.swiping=dx<0;
  if(coverageSwipe.swiping){e.preventDefault();e.currentTarget.classList.add('swiping');e.currentTarget.style.transform=`translateX(${Math.max(-92,dx)}px)`;}
 }
}
function coverageSwipeEnd(e){
 if(e.pointerType!=='touch'||coverageSwipe.row!==e.currentTarget)return;
 const row=e.currentTarget,dx=e.clientX-coverageSwipe.startX,dy=e.clientY-coverageSwipe.startY;
 row.classList.remove('swiping');
 if(coverageSwipe.swiping|| (dx<-50&&Math.abs(dx)>Math.abs(dy)*1.15)){row.style.transform='';row.classList.add('swiped');}
 else if(dx>30){row.style.transform='';row.classList.remove('swiped');}
 else if(Math.abs(dx)<10&&Math.abs(dy)<10&&row.classList.contains('swiped')){row.style.transform='';row.classList.remove('swiped');}
 coverageSwipe={row:null,startX:0,startY:0,swiping:false};
}
function bindCoverageSwipes(){document.querySelectorAll('.coverageSwipeRow').forEach(row=>{row.onpointerdown=coverageSwipeStart;row.onpointermove=coverageSwipeMove;row.onpointerup=coverageSwipeEnd;row.onpointercancel=coverageSwipeEnd;});}

function clientFilterMatches(c,f){
 let groups=Array.isArray(f.groups)?f.groups:[], statuses=Array.isArray(f.statuses)?f.statuses:[], products=Array.isArray(f.products)?f.products:[];
 let caseRows=db.cases.filter(x=>(x.ic&&x.ic===c.ic)||(!x.ic&&x.client===c.client));
 let statusHit=caseRows.some(x=>statuses.includes(normalizeStatus(x.status))) || statuses.includes(normalizeStatus(c.clientStatus||''));
 let productHit=caseRows.some(x=>products.includes(normalizeProduct(x.product||x.type)));
 return (!f.name||String(c.client||'').toLowerCase().includes(String(f.name).toLowerCase()))
   &&(!f.ic||String(c.ic||'').toLowerCase().includes(String(f.ic).toLowerCase()))
   &&(!groups.length||groups.includes(c.group||''))
   &&(!statuses.length||statusHit)
   &&(!products.length||productHit);
}

function normalizeImportedDate(v){
 if(v===null||v===undefined||v==='')return '';
 // Excel serial dates may arrive from SheetJS as numbers OR numeric strings.
 // Excel's 1900 date system uses 1899-12-30 as the conversion base.
 if(typeof v==='number' || /^\d+(?:\.\d+)?$/.test(String(v).trim())){
  let n=Number(v);
  if(Number.isFinite(n) && n>20000 && n<100000){
   let d=new Date(Date.UTC(1899,11,30));
   d.setUTCDate(d.getUTCDate()+Math.floor(n));
   return `${d.getUTCFullYear()}-${pad2(d.getUTCMonth()+1)}-${pad2(d.getUTCDate())}`;
  }
 }
 let s=String(v).trim();
 // Explicitly support common Malaysian Excel display formats: dd/mm/yyyy or dd-mm-yyyy.
 let m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/);
 if(m){
  let day=Number(m[1]),month=Number(m[2]),year=Number(m[3]);
  if(month>=1&&month<=12&&day>=1&&day<=31)return `${year}-${pad2(month)}-${pad2(day)}`;
 }
 if(/^\d{4}-\d{1,2}-\d{1,2}$/.test(s)){let a=s.split('-');return `${a[0]}-${pad2(a[1])}-${pad2(a[2])}`}
 let d=new Date(s);return isNaN(d)?s:iso(d)
}

function dropSetting(e){

function settingTouchStart(e){
 if(e.pointerType!=='touch')return;
 const row=e.currentTarget;
 closeSettingSwipes(row);

 settingTouch={row,key,index,startX:e.clientX,startY:e.clientY,lastX:e.clientX,lastY:e.clientY,dragging:false,swiping:false,timer:setTimeout(()=>startTouchSettingDrag(row),180)};
}
function startTouchSettingDrag(row){
 if(!settingTouch.row||settingTouch.row!==row)return;

}
function settingTouchMove(e){
 if(e.pointerType!=='touch'||settingTouch.row!==e.currentTarget)return;
 const dx=e.clientX-settingTouch.startX,dy=e.clientY-settingTouch.startY;
 settingTouch.lastX=e.clientX;settingTouch.lastY=e.clientY;
 if(!settingTouch.dragging && Math.abs(dx)>10 && Math.abs(dx)>Math.abs(dy)*1.25){
   clearTimeout(settingTouch.timer);settingTouch.swiping=dx<0;
   if(settingTouch.swiping){e.preventDefault();e.currentTarget.style.transform=`translateX(${Math.max(-88,dx)}px)`}
   return;
 }

   e.preventDefault();
   const row=e.currentTarget,under=document.elementFromPoint(e.clientX,e.clientY)?.closest('.settingSortRow');
   document.querySelectorAll('.settingSortRow.dropTarget').forEach(r=>r.classList.remove('dropTarget'));

 }
}
function settingTouchEnd(e){
 if(e.pointerType!=='touch'||settingTouch.row!==e.currentTarget)return;
 clearTimeout(settingTouch.timer);
 const row=e.currentTarget,dx=e.clientX-settingTouch.startX,dy=e.clientY-settingTouch.startY;
 if(settingTouch.dragging){
   e.preventDefault();
   const under=document.elementFromPoint(e.clientX,e.clientY)?.closest('.settingSortRow');
   const key=settingTouch.key,from=settingTouch.index,to=under?+under.dataset.settingIndex:from;

 }else if(dx>30){

   closeSettingSwipes(row);

async function backupData(){
 try{
  const storage={};
  for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k && k.startsWith('salesTracker')) storage[k]=localStorage.getItem(k)}
  storage[KEY]=JSON.stringify(db);
  let cloudSnapshot=null;
  if(window.cloudReady && window.cloudExportSnapshot){
   cloudSnapshot=await window.cloudExportSnapshot();
  }
  const payload={
   app:'Sales Tracker',
   backupVersion:2,
   appVersion:'2.1',
   createdAt:new Date().toISOString(),
   includes:['clients','policies','contests','coverage_analyses','settings','behaviourTracker','language','localStorage'],
   counts:{clients:db.clients.length,cases:db.cases.length,contests:db.contests.length,coverageAnalyses:(db.coverageAnalyses||[]).length,behaviourLogs:(db.behaviourTracker?.logs||[]).length},
   localStorage:storage,
   cloud:cloudSnapshot
  };
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='Sales_Tracker_Backup_'+iso(new Date())+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
  toast(cloudSnapshot?'Full backup created successfully':'Local backup created successfully');
 }catch(err){console.error(err);alert('Backup failed. Please try again.')}
}
function restoreBackup(event){
 const file=event.target.files?.[0];event.target.value='';if(!file)return;
 const reader=new FileReader();
 reader.onload=async()=>{
  try{
   const payload=JSON.parse(reader.result);
   if(payload?.app!=='Sales Tracker' || !payload?.localStorage || typeof payload.localStorage!== 'object') throw new Error('Invalid Sales Tracker backup');
   const incoming=payload.localStorage;
   const rawDb=incoming[KEY];
   if(!rawDb) throw new Error('Backup does not contain app data');
   const restored=JSON.parse(rawDb);
   const counts=payload.counts||{};
   const summary=`${counts.clients||restored.clients?.length||0} clients · ${counts.cases||restored.cases?.length||0} cases · ${counts.contests||restored.contests?.length||0} contests`;
   const scope=payload.cloud?'Cloud data + settings + local preferences':'App data + local preferences';
   if(!confirm(`Restore this backup?\n\n${summary}\nIncludes: ${scope}\nBackup date: ${payload.createdAt?new Date(payload.createdAt).toLocaleString('en-MY'):'Unknown'}\n\nCurrent app data will be replaced by this backup.`)) return;
   if(payload.cloud && window.cloudReady && window.cloudRestoreSnapshot){
    await window.cloudRestoreSnapshot(payload.cloud);
   }
   Object.keys(localStorage).filter(k=>k.startsWith('salesTracker')).forEach(k=>localStorage.removeItem(k));
   Object.entries(incoming).forEach(([k,v])=>{if(k.startsWith('salesTracker')) localStorage.setItem(k,String(v))});
   localStorage.setItem(KEY,JSON.stringify(restored));
   alert(payload.cloud?'Full restore successful. Sales Tracker will reload now.':'Restore successful. Sales Tracker will reload now.');
   location.reload();
  }catch(err){console.error(err);alert('Restore failed: '+(err?.message||'Invalid or corrupted backup file.'))}
 };
 reader.onerror=()=>alert('Restore failed: unable to read the selected file.');
 reader.readAsText(file);
}
async function resetData(){
 if(!confirm('Reset ALL Sales Tracker data?\n\nThis will permanently clear ALL Cases, Clients, Imported Portfolio, Contests, Coverage Analyses, Behaviour Tracker, custom Products/Groups/Benefits/Rates, theme, language and other app settings from this account.\n\nYour login account will remain. This cannot be undone.')) return;
 try{
  if(window.cloudReady && window.cloudResetAll){await window.cloudResetAll();}
  db={cases:[],clients:[],contests:[],coverageAnalyses:[],behaviourTracker:{targets:{},logs:[]},settings:structuredClone(defaults)};
  appLang='zh';
  for(let i=localStorage.length-1;i>=0;i--){const k=localStorage.key(i);if(k&&k.startsWith('salesTracker'))localStorage.removeItem(k)}
  localStorage.setItem(KEY,JSON.stringify(db));
  render();
  toast('All data and settings have been reset');
 }catch(err){console.error(err);alert('Reset failed: '+(err?.message||'Please try again.'))}
}

render();

    (data.policies||[]).forEach(r=>{const p=byCloudId.get(r.id);if(p&&r.parent_policy_id){const parent=byCloudId.get(r.parent_policy_id);if(parent)p.parentId=String(parent.id)}});
    const contests=(data.contests||[]).map(r=>({_cloudId:r.id,name:r.name||'',start:r.start_date||'',end:r.end_date||'',metric:r.metric||'TPC',type:Array.isArray(r.product_restriction)&&r.product_restriction.length?normalizeProduct(r.product_restriction[0]):'Any',target:num(r.target)}));
    const coverage=(data.coverage||[]).map(r=>{const x=r.calculation&&typeof r.calculation==='object'?{...r.calculation}:{ };x._cloudId=r.id;x.id=r.id;x.createdAt=r.created_at?new Date(r.created_at).getTime():Date.now();x.clientName=r.client_name||x.clientName||'';x.clientIc=r.client_ic||x.clientIc||'';x.monthlyIncome=num(r.monthly_income);x.spouseIncome=num(r.spouse_income);x.children=num(r.children);x.youngestChildAge=r.youngest_child_age;x.savings=num(r.savings);return x;});
    const settingsRow=(data.settings||[]).find(x=>x.setting_key==='settings');
    const behaviourRow=(data.settings||[]).find(x=>x.setting_key==='behaviourTracker');
    const langRow=(data.settings||[]).find(x=>x.setting_key==='language');
    db.clients=clients;db.cases=policies;db.contests=contests;db.coverageAnalyses=coverage;
    if(settingsRow?.setting_value)db.settings={...structuredClone(defaults),...settingsRow.setting_value};
    if(behaviourRow?.setting_value)db.behaviourTracker=behaviourRow.setting_value;
    if(langRow?.setting_value?.lang){appLang=langRow.setting_value.lang;localStorage.setItem('salesTrackerLang',appLang)}
    db.cases.forEach(c=>{c.status=normalizeStatus(c.status);c.product=normalizeProduct(c.product)});
    localStorage.setItem(KEY,JSON.stringify(db));
  }
  async function counts(){
    const tables=['clients','policies','contests','coverage_analyses']; let total=0;
    for(const table of tables){const {count,error}=await sb.from(table).select('*',{count:'exact',head:true});if(error)throw error;total+=count||0;}
    return total;
  }
  async function migrateIfNeeded(){
    const cloudCount=await counts();
    const localCount=(db.clients?.length||0)+(db.cases?.length||0)+(db.contests?.length||0)+(db.coverageAnalyses?.length||0);
    if(cloudCount===0&&localCount>0){
      cloudStatus('First-time setup: uploading this device data…');
      await cloudUploadAll();
      return;
    }
    if(cloudCount>0){
      cloudStatus('Loading your cloud data…');
      await fetchAndApply();
      return;
    }
  }
  async function fetchAndApply(){
    cloudLoading=true;
    try{const data=await fetchCloud();cloudToLocal(data);render();}
    finally{cloudLoading=false;}
  }
  function setupRealtime(){
    if(cloudChannel)sb.removeChannel(cloudChannel);
    cloudChannel=sb.channel('sales-tracker-sync')
      .on('postgres_changes',{event:'*',schema:'public',table:'clients',filter:`user_id=eq.${cloudUser.id}`},()=>cloudRealtimeChanged())
      .on('postgres_changes',{event:'*',schema:'public',table:'policies',filter:`user_id=eq.${cloudUser.id}`},()=>cloudRealtimeChanged())
      .on('postgres_changes',{event:'*',schema:'public',table:'contests',filter:`user_id=eq.${cloudUser.id}`},()=>cloudRealtimeChanged())
      .on('postgres_changes',{event:'*',schema:'public',table:'coverage_analyses',filter:`user_id=eq.${cloudUser.id}`},()=>cloudRealtimeChanged())
      .on('postgres_changes',{event:'*',schema:'public',table:'app_settings',filter:`user_id=eq.${cloudUser.id}`},()=>cloudRealtimeChanged())
      .subscribe();
  }
  let rtTimer=null;
  function cloudRealtimeChanged(){
    if(cloudSyncing||cloudLoading)return;
    clearTimeout(rtTimer);rtTimer=setTimeout(async()=>{try{await fetchAndApply();cloudSyncStatus('Synced','')}catch(e){console.error(e)}},500);
  }
  async function afterLogin(session){
    cloudUser=session.user; window.cloudReady=true;
    try{
      const {error}=await sb.from('profiles').upsert({id:cloudUser.id,email:cloudUser.email||'',display_name:cloudUser.user_metadata?.name||cloudUser.email||'',updated_at:new Date().toISOString()},{onConflict:'id'});
      if(error)throw error;
      await migrateIfNeeded();
      setupRealtime();
      gate.classList.remove('show');document.body.classList.remove('cloudLocked');
      cloudStatus('');
      render();
      cloudSyncStatus('Cloud synced','');
    }catch(e){console.error(e);window.cloudReady=false;cloudStatus(e.message||'Cloud setup failed','error');}
  }
  window.cloudSendOtp=async function(){
    const email=document.getElementById('cloudEmail').value.trim();
    if(!email){cloudStatus('Please enter your email.','error');return;}
    cloudStatus('Sending verification email…');
    const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname}});
    if(error){cloudStatus(error.message,'error');return;}
    document.getElementById('cloudOtpWrap').classList.add('show');
    cloudStatus('Check your email. Enter the 6-digit code here, or use the secure link in the email.','ok');
  };
  window.cloudVerifyOtp=async function(){
    const email=document.getElementById('cloudEmail').value.trim();
    const token=document.getElementById('cloudOtp').value.trim();
    if(!email||!token){cloudStatus('Enter your email and the code.','error');return;}
    cloudStatus('Verifying…');
    const {data,error}=await sb.auth.verifyOtp({email,token,type:'email'});
    if(error){cloudStatus(error.message,'error');return;}
    await afterLogin(data.session);
  };
  sb.auth.onAuthStateChange(async(event,session)=>{
    if(session&&['SIGNED_IN','INITIAL_SESSION','TOKEN_REFRESHED'].includes(event)){
      if(!cloudUser||cloudUser.id!==session.user.id)await afterLogin(session);
    }
  });
  sb.auth.getSession().then(async({data})=>{if(data.session)await afterLogin(data.session);else{gate.classList.add('show');document.body.classList.add('cloudLocked');}}).catch(e=>cloudStatus(e.message,'error'));
})();
</script>
</body></html>
