<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f6f2">
<title>Sales Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--bg:#f6f5f1;--card:#fff;--text:#20211f;--muted:#777871;--line:#e6e4dd;--accent:#20211f;--green:#4f765c;--red:#a35b52;--yellow:#9a7b38}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC",sans-serif}
.app{max-width:1100px;margin:auto;padding-bottom:90px}.top{padding:24px 20px 12px;display:flex;justify-content:space-between;align-items:end;gap:12px}.brand{font-size:24px;font-weight:700}.sub{font-size:12px;color:var(--muted);margin-top:4px}
nav{position:sticky;top:0;z-index:5;background:rgba(246,245,241,.94);backdrop-filter:blur(14px);display:flex;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line);overflow:auto}
nav button{border:0;background:transparent;padding:10px 13px;border-radius:12px;white-space:nowrap;color:var(--muted);font-weight:600}nav button.active{background:#20211f;color:white}
main{padding:16px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}.metric{font-size:25px;font-weight:750;margin-top:6px}.label{font-size:12px;color:var(--muted)}.section{margin:22px 0 10px;font-size:15px;font-weight:750}
.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.stack{display:flex;flex-direction:column;gap:10px}.pill{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:700;background:#eeece6}.pill.green{background:#e6efe8;color:#42644d}.pill.red{background:#f4e5e2;color:#914d45}.pill.yellow{background:#f3ecd8;color:#82692c}
button.primary{background:#20211f;color:#fff;border:0;border-radius:12px;padding:11px 15px;font-weight:700}button.secondary{background:white;border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-weight:650}button.danger{background:#f4e5e2;color:#914d45;border:0;border-radius:12px;padding:10px 14px;font-weight:650}.linkBtn{border:0;background:none;padding:0;text-align:left;font:inherit;font-weight:700;color:inherit;cursor:pointer}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid #dcdad2;border-radius:11px;background:white;font:inherit}textarea{min-height:80px}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}.full{grid-column:1/-1}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.list{display:flex;flex-direction:column;gap:9px}.item{background:white;border:1px solid var(--line);border-radius:15px;padding:14px}.small{font-size:12px;color:var(--muted)}.right{text-align:right}.hide{display:none}.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed #d8d6ce;border-radius:16px}
.menuGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.menuBtn{background:white;border:1px solid var(--line);border-radius:18px;padding:22px;text-align:left;font-weight:750;font-size:16px}.menuBtn span{display:block;color:var(--muted);font-size:12px;font-weight:500;margin-top:6px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:20;padding:12px;overflow:auto}.modalBox{background:var(--bg);max-width:760px;margin:30px auto;border-radius:22px;padding:18px}
.benefitBox{background:#faf9f5;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}.coverageGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}
.searchGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.chart{height:190px;position:relative;margin-top:8px}.barChart{height:190px;display:flex;align-items:end;gap:5px;border-bottom:1px solid var(--line);padding:10px 4px}.bar{background:#20211f;border-radius:4px 4px 0 0;min-width:6px;flex:1}.pieWrap{display:flex;align-items:center;gap:16px;justify-content:center;margin:12px 0}.pie{width:130px;height:130px;border-radius:50%;background:conic-gradient(#20211f 0 45%,#777871 45% 72%,#b7b4aa 72% 100%)}.legend{font-size:12px;color:var(--muted)}.legend div{margin:5px 0}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#20211f;color:white;padding:11px 16px;border-radius:12px;z-index:50;font-size:13px}
@media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}.grid3{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.top{padding:20px 16px 10px}main{padding:12px}.metric{font-size:21px}.menuGrid{grid-template-columns:1fr}.searchGrid{grid-template-columns:1fr 1fr}.coverageGrid{grid-template-columns:1fr}}

.rangeRow{display:grid;grid-template-columns:1fr 1fr;gap:8px}.chartCard{padding:14px}.svgChart{width:100%;height:250px;display:block}.chartLegend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:6px}.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:#20211f;margin-right:4px}.barLegend{background:#777871}.importHint{background:#faf9f5;border:1px dashed #d6d3ca;border-radius:12px;padding:12px;font-size:12px;color:var(--muted)}
@media(max-width:760px){.rangeRow{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div><div class="brand">Sales Tracker</div><div class="sub">Insurance CRM · V1.10 Prototype</div></div><button class="primary" onclick="startCase()">＋ New Case</button></header>
<nav id="nav">
<button class="active" onclick="show('home',this)">Home</button>
<button onclick="show('pipeline',this)">Pipeline</button>
<button onclick="show('sales',this)">Sales</button>
<button onclick="show('clients',this)">Clients</button>
<button onclick="show('contest',this)">Contest</button>
<button onclick="show('income',this)">Income</button>
<button onclick="show('settings',this)">Settings</button>
</nav>
<main>
<section id="home"></section><section id="pipeline" class="hide"></section><section id="sales" class="hide"></section><section id="clients" class="hide"></section><section id="contest" class="hide"></section><section id="income" class="hide"></section><section id="settings" class="hide"></section>
</main></div>
<script>
const KEY='salesTrackerV14';
const defaults={
 products:["PRU With You Plus","PRU Wealth Enrich 2.0","PRU Lady / Man"],
 groups:["A","B","C","D"],
 benefits:["Death / TPD","TMCC","43 CI","Acci Death / TPD","Acci Medical Reimbursement (per case)","Medical Card","Payor"],
 rates:[.25,.25,.135,.185,.15,.15]
};
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{cases:[],clients:[],contests:[],settings:structuredClone(defaults)};
db.cases=db.cases||[];db.clients=db.clients||[];db.contests=db.contests||[];
db.settings={...structuredClone(defaults),...(db.settings||{})};
for(const k of ['products','groups','benefits']) if(!Array.isArray(db.settings[k])) db.settings[k]=structuredClone(defaults[k]);
// Normalize imported/existing product names so product codes in trailing parentheses
// never create separate products in Sales, Clients, Contest or Settings.
db.settings.products=[...new Set(db.settings.products.map(normalizeProduct).filter(Boolean))];
db.cases.forEach(c=>{ if(c.product)c.product=normalizeProduct(c.product); if(c.type)c.type=normalizeProduct(c.type); });
db.contests.forEach(c=>{ if(c.type && c.type!=='Any') c.type=normalizeProduct(c.type); });
localStorage.setItem(KEY,JSON.stringify(db));
// Keep Settings > Products synchronized with products imported from Excel/RAISe.
const importedProducts=[...new Set(db.cases.map(c=>c.product||c.type).filter(Boolean))];
importedProducts.forEach(p=>{if(!db.settings.products.includes(p)) db.settings.products.push(p)});
function normalizeStatus(v){
 let s=String(v||'').trim();
 let m={'INFORCE':'Inforce','LAPSED':'Lapse','LAPSE':'Lapse','CANCELLED':'Ceased','CANCELED':'Ceased','SURRENDER':'Surrender','CEASED':'Ceased','TO APPROACH':'To Approach','TO MEET UP':'To Meet Up','TO FOLLOW UP':'To Follow Up','TO SUBMIT':'To Submit','TO APPROVE':'To Approve'};
 return m[s.toUpperCase()]||s;
}
// Normalize imported/existing records so RAISe values such as INFORCE/LAPSED/CANCELLED
// participate in the same calculations and filters as manually keyed records.
db.cases.forEach(c=>{if(c.status)c.status=normalizeStatus(c.status); if(c.clientStatus)c.clientStatus=normalizeStatus(c.clientStatus);});
function normalizeProduct(v){
 let s=String(v||'').trim();
 // RAISe product values may contain a product code in trailing parentheses,
 // e.g. "PRUWith You Plus (PWZ)". The app stores/compares only the product name.
 s=s.replace(/\\s*\\([^()]*\\)\\s*$/,'').trim();
 return s;
}
function allProducts(){
 return [...new Set([...db.settings.products,...db.cases.map(c=>normalizeProduct(c.product||c.type)).filter(Boolean)])];
}

function normalizeHeader(v){return String(v||'').toLowerCase().replace(/[\s_\-\/()]+/g,'').replace(/[^\w\u4e00-\u9fff]/g,'')}
function clientRecords(){
 const m=new Map();
 db.clients.forEach(c=>m.set(c.ic||c.client,c));
 db.cases.forEach(c=>{let k=c.ic||c.client;if(!m.has(k))m.set(k,{client:c.client,ic:c.ic,group:c.group||'',clientStatus:c.clientStatus||''})});
 return [...m.values()];
}
function upsertClient(c){
 if(!c.ic && !c.client)return;
 let key=c.ic||c.client, i=db.clients.findIndex(x=>(x.ic||x.client)===key);
 if(i>=0) db.clients[i]={...db.clients[i],...c}; else db.clients.push(c);
}

function save(){localStorage.setItem(KEY,JSON.stringify(db));render()}
function money(n){return 'RM '+Number(n||0).toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2})}
function dateStr(d){return d?new Date(d+'T00:00:00').toLocaleDateString('en-MY',{day:'2-digit',month:'short',year:'numeric'}):'-'}
function monthKey(d=new Date()){return d.toISOString().slice(0,7)}
function annual(c){return c.payMode==='monthly'?+c.premium*12:c.payMode==='quarterly'?+c.premium*4:c.payMode==='halfyearly'?+c.premium*2:+c.premium}
function tpc(c){return +c.tpc||annual(c)}
function factor(c){return c.term==='10'?.5:c.term==='5'?.25:1}
function duration(c){return c.term==='5'?5:6}
function eligible(c){return normalizeStatus(c.status)==='Inforce'}
function cycleStart(c){return c.commissionStart||c.inforce}
function monthlyComm(c,date){
 if(!eligible(c))return 0;
 let start=new Date(cycleStart(c)+'T00:00:00'), d=new Date(date+'T00:00:00');
 let m=Math.floor((d.getFullYear()-start.getFullYear())*12+d.getMonth()-start.getMonth())+1;
 if(m<1||m>duration(c)*12)return 0;
 let y=Math.ceil(m/12), yearly=tpc(c)*db.settings.rates[y-1]*factor(c);
 return c.payMode==='monthly'?yearly/12:c.payMode==='quarterly'?(m%3===1?yearly/4:0):c.payMode==='halfyearly'?(m%6===1?yearly/2:0):(m===((y-1)*12+1)?yearly:0);
}
function show(id,btn){document.querySelectorAll('main section').forEach(x=>x.classList.add('hide'));document.getElementById(id).classList.remove('hide');document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));btn.classList.add('active');render()}
function closeModal(){document.querySelectorAll('.modal').forEach(x=>x.remove())}
function modal(title,body,wide=false){let el=document.createElement('div');el.className='modal';el.innerHTML=`<div class="modalBox" style="${wide?'max-width:900px':''}"><div class="row"><h2 style="margin:4px 0 14px">${title}</h2><button class="secondary" onclick="this.closest('.modal').remove()">Close</button></div>${body}</div>`;document.body.appendChild(el);return el}
function toast(t){let e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),1800)}
function render(){home();pipeline();sales();clients();contest();income();settings()}

function startCase(){modal('New Case',`<div class="menuGrid"><button class="menuBtn" onclick="chooseNB()">New Business<span>New policy / new sale</span></button><button class="menuBtn" onclick="chooseTU()">Top Up<span>Upgrade an existing policy</span></button></div>`)}
function chooseNB(){modal('New Business',`<div class="menuGrid"><button class="menuBtn" onclick="caseForm('new')">New Client<span>Enter client details</span></button><button class="menuBtn" onclick="existingPicker('new')">Existing Client<span>Select an existing client</span></button></div>`)}
function chooseTU(){existingPicker('topup')}
function existingPicker(mode){
 let html=`<div class="field"><label>Client Name</label><input id="clientSearch" placeholder="Type existing client name" oninput="suggestClients('${mode}')"><div id="suggestions" class="list" style="margin-top:8px"></div></div>`;
 modal(mode==='topup'?'Top Up · Select Client':'New Business · Existing Client',html)
}
function suggestClients(mode){
 let q=(document.getElementById('clientSearch').value||'').toLowerCase(), rows=clientRecords().filter(c=>String(c.client||'').toLowerCase().includes(q)||String(c.ic||'').includes(q));
 document.getElementById('suggestions').innerHTML=rows.slice(0,20).map(c=>`<button class="secondary" onclick="caseForm('${mode}','${c.ic||''}')">${c.client} · ${c.ic||'-'}</button>`).join('')||'<div class="small">No matching existing client.</div>';
}
function benefitFields(existing={}){
 return db.settings.benefits.map(b=>{
  if(b==='Medical Card') return `<div class="benefitBox"><b>Medical Card</b><div class="coverageGrid"><input name="med_plan" placeholder="Medical Plan Name" value="${existing.med_plan||''}"><input name="med_limit" type="number" placeholder="Annual Limit" value="${existing.med_limit||''}"><input name="med_whole" type="number" placeholder="Whole Life Limit" value="${existing.med_whole||''}"><input name="med_room" type="number" placeholder="Room & Board" value="${existing.med_room||''}"><input name="med_deduct" type="number" placeholder="Deductible / Med Saver" value="${existing.med_deduct||''}"></div></div>`;
  if(b==='Payor') return `<div class="benefitBox"><label><input style="width:auto" type="checkbox" name="payor" ${existing.payor?'checked':''}> Payor</label></div>`;
  let key='b_'+b.replace(/[^a-zA-Z0-9]/g,'_');
  return `<div class="benefitBox"><div class="row"><b>${b}</b><input style="max-width:220px" name="${key}" type="number" step=".01" placeholder="Coverage Amount" value="${existing[key]||''}"></div></div>`;
 }).join('')
}
function parseBenefits(fd){
 let out={};for(let [k,v] of fd.entries())if(k.startsWith('b_')||['med_plan','med_limit','med_whole','med_room','med_deduct','payor'].includes(k))out[k]=v;return out
}
function caseForm(mode,ic='',reduceId=''){
 let c=ic?(db.clients.find(x=>x.ic===ic)||db.cases.find(x=>x.ic===ic)||{}):{}, existingProducts=ic?[...new Set(db.cases.filter(x=>x.ic===ic&&x.status!=='Surrender'&&x.status!=='Lapse'&&x.status!=='Ceased').map(x=>x.product||x.type))]:[];
 let isReduce=mode==='reduce', base=reduceId?db.cases.find(x=>x.id===reduceId):null;
 if(base)c={...base};
 let productOptions=allProducts().map(p=>`<option ${c.product===p?'selected':''}>${p}</option>`).join('');
 let groupOptions=db.settings.groups.map(g=>`<option ${c.group===g?'selected':''}>${g}</option>`).join('');
 let clientBlock=mode==='new'?`<div class="field"><label>Client Name</label><input name="client" required></div><div class="field"><label>Client IC</label><input name="ic" required></div><div class="field"><label>Client Group</label><select name="group">${groupOptions}</select></div>`:
 `<div class="field full"><label>Client</label><input value="${c.client||''}" disabled><input type="hidden" name="client" value="${c.client||''}"><input type="hidden" name="ic" value="${c.ic||''}"><input type="hidden" name="group" value="${c.group||''}"></div>`;
 let top=`${mode==='topup'?`<div class="field full"><label>Existing Product to Top Up</label><select name="parentPolicy">${existingProducts.map(p=>`<option>${p}</option>`).join('')}</select></div>`:''}`;
 let title=isReduce?'Reduce Policy':mode==='topup'?'Top Up':mode==='existing'?'New Business · Existing Client':'New Business · New Client';
 let statusOptions=['To Approach','To Meet Up','To Follow Up','To Submit','To Approve','Inforce','Surrender','Lapse','Ceased'];
 let benefits=JSON.parse(c.benefit||'{}');
 modal(title,`<form onsubmit="saveCaseForm(event,'${mode}','${reduceId}')"><div class="formgrid">${clientBlock}${top}
 <div class="field"><label>Product</label><select name="product">${productOptions}</select></div>
 <div class="field"><label>Benefit</label><div class="small">Coverage details below</div></div>
 <div class="field full">${benefitFields(benefits)}</div>
 <div class="field"><label>Inforce Date</label><input type="date" name="inforce" required value="${c.inforce||new Date().toISOString().slice(0,10)}"></div>
 <div class="field"><label>Status</label><select name="status">${statusOptions.map(s=>`<option ${c.status===s?'selected':''}>${s}</option>`).join('')}</select></div>
 <div class="field"><label>Premium (per payment)</label><input id="premium" type="number" step=".01" name="premium" required value="${c.premium||''}"></div>
 <div class="field"><label>Payment Mode</label><select id="payMode" name="payMode">${[['monthly','Monthly'],['quarterly','Quarterly'],['halfyearly','Half-Yearly'],['yearly','Yearly']].map(a=>`<option value="${a[0]}" ${c.payMode===a[0]?'selected':''}>${a[1]}</option>`).join('')}</select></div>
 <div class="field"><label>Payment Term</label><select name="term"><option value="20" ${(!c.term||c.term==='20')?'selected':''}>20 Year / Full Pay</option><option value="10" ${c.term==='10'?'selected':''}>10 Year</option><option value="5" ${c.term==='5'?'selected':''}>5 Year</option></select></div>
 <div class="field"><label>TPC (First Year Annual Premium)</label><input id="tpc" name="tpc" readonly></div>
 </div><div class="actions"><button type="button" class="secondary" onclick="closeModal()">Cancel</button><button class="primary">Save Case</button></div></form>`);
 let f=document.querySelector('.modal form'),p=f.querySelector('#premium'),pm=f.querySelector('#payMode'),t=f.querySelector('#tpc');
 function calc(){let x=+p.value||0;t.value=(pm.value==='monthly'?x*12:pm.value==='quarterly'?x*4:pm.value==='halfyearly'?x*2:x).toFixed(2)}
 p.oninput=calc;pm.onchange=calc;calc()
}
function saveCaseForm(e,mode,reduceId){e.preventDefault();let fd=new FormData(e.target),o=Object.fromEntries(fd.entries());o.product=normalizeProduct(o.product);o.id=reduceId||Date.now().toString();o.premium=+o.premium;o.tpc=+o.tpc;o.benefit=JSON.stringify(parseBenefits(fd));o.kind=mode==='topup'?'Top Up':mode==='reduce'?'Reduce':'New Business';
 upsertClient({client:o.client,ic:o.ic,group:o.group,clientStatus:o.status});
 if(mode==='topup'){let parent=db.cases.find(c=>(c.client===o.client&&c.product===o.parentPolicy)||c.product===o.parentPolicy);o.commissionStart=o.inforce;o.parentId=parent?.id||''}
 if(mode==='reduce'&&reduceId){let old=db.cases.find(c=>c.id===reduceId);o.commissionStart=old.commissionStart||old.inforce;o.parentId=old.parentId||''}
 if(reduceId){let i=db.cases.findIndex(c=>c.id===reduceId);db.cases[i]={...db.cases[i],...o}}
 else db.cases.push(o);
 closeModal();save();toast('Case saved')
}

function home(){
 let m=monthKey(),cs=db.cases.filter(c=>c.inforce?.startsWith(m)&&c.kind!=='Reduce'&&normalizeStatus(c.status)==='Inforce'),t=cs.reduce((s,c)=>s+tpc(c),0),cases=Math.floor(t/1800);
 let ongoing=db.contests.filter(x=>x.start<=new Date().toISOString().slice(0,10)&&x.end>=new Date().toISOString().slice(0,10));
 document.getElementById('home').innerHTML=`<div class="section">${new Date().toLocaleString('en-MY',{month:'long',year:'numeric'})} · Production Overview</div>
 <div class="grid"><div class="card" onclick="breakdown('TPC',cs)"><div class="label">TPC</div><div class="metric">${money(t)}</div><div class="small">Tap for breakdown</div></div><div class="card" onclick="breakdown('Cases',cs)"><div class="label">Cases</div><div class="metric">${cases}</div><div class="small">RM1,800 TPC = 1 case</div></div></div>
 <div class="section">Ongoing Contests</div><div class="list">${ongoing.map(x=>`<div class="card"><div class="row"><b>${x.name}</b><span class="pill yellow">${x.metric}</span></div><div class="small">${x.start} → ${x.end}</div><div class="metric">${contestValue(x)}</div></div>`).join('')||'<div class="empty">No ongoing contests.</div>'}</div>`
}
function breakdown(title,rows){modal(title+' Breakdown',`<div class="list">${rows.map(c=>`<div class="item"><div class="row"><div><b>${c.client}</b><div class="small">${c.product||c.type} · ${c.kind}</div></div><b>${money(tpc(c))}</b></div></div>`).join('')||'<div class="empty">No records.</div>'}</div>`)}
function pipeline(){
 let statuses=['To Approach','To Meet Up','To Follow Up','To Submit','To Approve','Inforce'];
 document.getElementById('pipeline').innerHTML=`<div class="section">Sales Pipeline</div><div class="list">${statuses.map((st,i)=>{
   let x=db.cases.filter(c=>c.status===st),id='stage'+i;
   return `<div class="card">
     <button class="linkBtn" style="width:100%" onclick="document.getElementById('${id}').classList.toggle('hide')">
       <div class="row"><div><b>${st}</b><div class="small">${x.length} client${x.length===1?'':'s'}</div></div><span class="pill">${x.length}</span></div>
     </button>
     <div id="${id}" class="hide" style="margin-top:12px"><div class="list">
       ${x.map(c=>`<div class="item" onclick="event.stopPropagation()">
         <div class="row"><div><button class="linkBtn" onclick="editCase('${c.id}')">${c.client}</button><div class="small">${c.product||c.type||'-'} · ${money(tpc(c))} · ${c.kind||'New Business'}</div></div>
         <button class="${st==='To Approve'?'primary':'secondary'}" onclick="editCase('${c.id}')">${st==='To Approve'?'Approve':'Open'}</button></div>
         <div class="small" style="margin-top:7px">${dateStr(c.inforce)} · ${c.payMode||'-'} · ${c.ic||''}</div>
       </div>`).join('')||'<div class="small">No records</div>'}
     </div></div>
   </div>`}).join('')}</div>`
}
function editCase(id){let c=db.cases.find(x=>x.id===id);if(!c)return;caseForm('edit',c.ic,id)}
function sales(){
 let cfg=salesCfg||{view:'month',year:new Date().getFullYear(),month:monthKey(new Date()).slice(5),quarter:1,half:'first',anchor:'',from:'',to:'',group:'auto'}, now=new Date();
 saveSalesCfgV10();
 // Backward compatibility with V1.9 saved selector values.
 if(cfg.view==='h1'||cfg.view==='h2'){const oldHalf=cfg.view;cfg.view='half';cfg.half=oldHalf==='h2'?'second':'first';saveSalesCfgV10()}
 let dates=resolveSalesRangeV10(cfg,now);

 let current=months[months.length-1]?.v||0,utd=active.reduce((s,c)=>s+monthlyComm(c,monthKey()+'-01'),0),clients=clientRecords().length;
 let max=Math.max(...months.map(x=>x.v),1),bars=months.slice(-24).map(x=>`<div class="bar" title="${x.key}: ${money(x.v)}" style="height:${Math.max(3,x.v/max*100)}%"></div>`).join('');
 document.getElementById('income').innerHTML=`<div class="row"><div class="section">Income</div><select style="width:130px" onchange="incomePeriod=this.value;render()"><option value="month" ${period==='month'?'selected':''}>1 Month</option><option value="quarter" ${period==='quarter'?'selected':''}>Quarter</option><option value="year" ${period==='year'?'selected':''}>1 Year</option><option value="3y" ${period==='3y'?'selected':''}>3 Years</option><option value="5y" ${period==='5y'?'selected':''}>5 Years</option><option value="7y" ${period==='7y'?'selected':''}>7 Years</option><option value="10y" ${period==='10y'?'selected':''}>10 Years</option></select></div><div class="card"><div class="label">Income Trend</div><div class="barChart">${bars||'<div class="empty">No commission data.</div>'}</div></div><div class="section">Estimated Income</div><div class="grid"><div class="card" onclick="incomeBreakdown('month')"><div class="label">This Month</div><div class="metric">${money(current)}</div><div class="small">Production done this month · tap for breakdown</div></div><div class="card" onclick="incomeBreakdown('utd')"><div class="label">Estimated UTD Monthly Income</div><div class="metric">${money(utd)}</div><div class="small">All currently inforce policies · tap for breakdown</div></div><div class="card"><div class="label">Active Policies</div><div class="metric">${active.length}</div></div><div class="card"><div class="label">Number of Clients</div><div class="metric">${clients}</div><div class="small">One client = one name/IC</div></div></div>`
}
let incomePeriod='month';
function incomeBreakdown(type){let date=monthKey()+'-01',rows=db.cases.filter(c=>normalizeStatus(c.status)==='Inforce').map(c=>({c,v:monthlyComm(c,date)})).filter(x=>x.v>0);modal(type==='month'?'This Month Breakdown':'UTD Monthly Income Breakdown',`<div class="list">${rows.map(x=>`<div class="item"><div class="row"><div><b>${x.c.client}</b><div class="small">${x.c.product||x.c.type} · ${x.c.kind}</div></div><b>${money(x.v)}</b></div></div>`).join('')||'<div class="empty">No commission for this period.</div>'}</div>`)}

function settings(){
 document.getElementById('settings').innerHTML=`<div class="section">Settings</div><div class="card"><h3>Products</h3>${db.settings.products.map((p,i)=>`<div class="row" style="margin:8px 0"><span>${p}</span><button class="danger" onclick="removeSetting('products',${i})">Remove</button></div>`).join('')}<button class="secondary" onclick="addSetting('products','Product name')">＋ Add Product</button></div><div class="card" style="margin-top:10px"><h3>Client Groups</h3><div>${db.settings.groups.join(' · ')}</div><button class="secondary" style="margin-top:10px" onclick="addSetting('groups','Group')">＋ Add Group</button></div><div class="card" style="margin-top:10px"><h3>Benefits</h3>${db.settings.benefits.map((p,i)=>`<div class="row" style="margin:8px 0"><span>${p}</span><button class="danger" onclick="removeSetting('benefits',${i})">Remove</button></div>`).join('')}<button class="secondary" onclick="addSetting('benefits','Benefit name')">＋ Add Benefit</button></div><div class="card" style="margin-top:10px"><h3>Data</h3><button class="danger" onclick="resetData()">Reset All Data</button></div>`
}
function addSetting(k,label){let v=prompt(label);if(v){db.settings[k].push(v);save()}}
function removeSetting(k,i){if(confirm('Remove this option?')){db.settings[k].splice(i,1);save()}}
function resetData(){if(confirm('Reset all sales, client and contest data? This cannot be undone.')){db.cases=[];db.clients=[];db.contests=[];save()}}

render();
</script>
</body></html>
